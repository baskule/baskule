<h1>Baskule</h1>
<p>Placeholder web bundle served by the <code>baskule</code> Worker. The T3 web build (WP-E) replaces it:
build with <code>BASKULE_WEB_DIR=&lt;dir&gt; pnpm run build</code>.</p>
<p>API: <code>/auth/*</code> (Better Auth), <code>/api/baskule/*</code>, spaces under <code>/s/&lt;spaceId&gt;/</code>,
downloads under <a href="/downloads/">/downloads/</a>.</p>
</body>
