# Released cluster role. See docs/install-cluster.md.
name: baskule-node
services:
  node:
    image: ${BASKULE_REGISTRY:-ghcr.io/baskule}/baskule-celld:${BASKULE_VERSION:-0.5.0}
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -sf
      - -o
      - /dev/null
      - http://127.0.0.1:47091/.well-known/celld/health
      interval: 5s
      timeout: 3s
      start_period: 60s
      start_interval: 1s
      retries: 3
    stop_grace_period: 50s
    cpus: ${CELLD_CPUS:-2}
    mem_limit: ${CELLD_MEMORY:-3g}
    command:
    - --listen
    - 0.0.0.0:47091
    - --internal-listen
    - 0.0.0.0:47092
    - --advertise
    - ${BASKULE_PRIVATE_IP}:${CELLD_INTERNAL_PORT:-47092}
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      AWS_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
      CELLD_BUCKET_NAME: ${CELLD_BUCKET_NAME:?set CELLD_BUCKET_NAME}
      CELLD_BUCKET: s3://${CELLD_BUCKET_NAME}
      CELLD_V8_HEAP_LIMIT_MB: ${CELLD_V8_HEAP_LIMIT_MB:-1024}
      CELLD_FETCH_TIMEOUT_S: ${CELLD_FETCH_TIMEOUT_S:-3600}
      CELLD_MAX_ASSET_FILE_BYTES: ${CELLD_MAX_ASSET_FILE_BYTES:-536870912}
      CELLD_OTEL: ${BASKULE_CELLD_OTEL:-0}
      DO_NOT_TRACK: '1'
      RUST_LOG: ${CELLD_RUST_LOG:-info}
      CELLD_NODE: ${CELLD_NODE:?set a unique CELLD_NODE}
    volumes:
    - celld:/var/lib/celld
    ports:
    - ${BASKULE_PRIVATE_IP:?set BASKULE_PRIVATE_IP}:${CELLD_WORKER_PORT:-47091}:47091
    - ${BASKULE_PRIVATE_IP}:${CELLD_INTERNAL_PORT:-47092}:47092
  deploy:
    image: ${BASKULE_REGISTRY:-ghcr.io/baskule}/baskule-celld:${BASKULE_VERSION:-0.5.0}
    entrypoint:
    - baskule-celld-job
    - deploy
    restart: 'no'
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      AWS_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
      CELLD_BUCKET_NAME: ${CELLD_BUCKET_NAME:?set CELLD_BUCKET_NAME}
      CELLD_BUCKET: s3://${CELLD_BUCKET_NAME}
      CELLD_MAX_ASSET_FILE_BYTES: ${CELLD_MAX_ASSET_FILE_BYTES:-536870912}
      DEPLOY_APP: platform
      CELLD_NODES_INTERNAL: ${CELLD_NODES_INTERNAL:?list all platform nodes as private-ip:47092}
      PUBLIC_ORIGINS: ${PUBLIC_ORIGINS:-http://127.0.0.1:47090}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      COMPUTERD_URL: ${COMPUTERD_URL:?set the private computerd URL}
      COMPUTERD_TOKEN: ${COMPUTERD_TOKEN:?set COMPUTERD_TOKEN in .env}
      OTLP_TRACES_URL: ${BASKULE_OTLP_TRACES_URL:-}
    env_file: .env
    volumes:
    - ./config:/src/config:ro
    depends_on:
      node:
        condition: service_started
    profiles:
    - deploy
volumes:
  celld: {}
