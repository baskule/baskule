{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-celld
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: celld}
  policyTypes: [Ingress]
  ingress:
    - ports: [{port: 47091, protocol: TCP}]
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}
            matchExpressions:
              - {key: app.kubernetes.io/component, operator: In, values: [celld, deploy]}
      ports: [{port: 47092, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-computerd
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: computerd}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: celld}
      ports: [{port: 47094, protocol: TCP}]
---
# The user API is anonymous on this private listener, as on Compose. Only
# computerd and authenticated supervisor callbacks may reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-openshell
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: {{ include "openshell.name" .Subcharts.openshell }}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: computerd}
        - podSelector:
            matchLabels: {openshell.ai/boundary-role: supervisor}
        - podSelector:
            matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: {{ include "openshell.name" .Subcharts.openshell }}}
      ports: [{port: 8080, protocol: TCP}]
---
# OpenShell itself installs a workload egress deny and a boundary ingress rule.
# Keep the deny declared here as well; adding an allow rule would weaken it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-computer-egress
spec:
  podSelector:
    matchLabels: {openshell.ai/boundary-role: workload}
  policyTypes: [Egress]
  egress: []
{{- if .Values.rustfs.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-rustfs
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: rustfs}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}
            matchExpressions:
              - {key: app.kubernetes.io/component, operator: In, values: [celld, deploy]}
      ports: [{port: 3900, protocol: TCP}]
{{- end }}
{{- end }}
