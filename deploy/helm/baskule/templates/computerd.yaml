apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-computerd
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: computerd}
  ports:
    - {name: http, port: 47094}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-computerd
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: computerd}
  template:
    metadata:
      labels:
        {{- include "baskule.labels" . | nindent 8 }}
        app.kubernetes.io/component: computerd
    spec:
      serviceAccountName: {{ .Release.Name }}-computerd
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: computerd
          image: {{ include "baskule.image" (dict "root" . "name" "computerd") }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          env:
            - {name: COMPUTER_BACKEND, value: kubernetes}
            - name: COMPUTERD_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ include "baskule.secretName" . }}, key: COMPUTERD_TOKEN}
            - {name: COMPUTERD_INSTANCE, value: {{ .Release.Name | quote }}}
            - {name: COMPUTER_IMAGE, value: {{ (.Values.computers.image | default (include "baskule.image" (dict "root" . "name" "computer"))) | quote }}}
            - {name: COMPUTER_CPUS, value: {{ .Values.computers.cpus | quote }}}
            - {name: COMPUTER_MEMORY, value: {{ .Values.computers.memory | quote }}}
            - {name: PRODUCT_SETTINGS_URL, value: {{ printf "http://%s/api/baskule/runtime-settings" .Release.Name | quote }}}
            - {name: COMPUTER_DISK_SIZE, value: {{ .Values.computers.diskSize | quote }}}
            - {name: COMPUTER_STORAGE_CLASS, value: {{ .Values.computers.storageClass | quote }}}
            - {name: COMPUTER_RUNTIME_CLASS_NAME, value: {{ .Values.computers.runtimeClassName | quote }}}
            - {name: COMPUTER_NODE_SELECTOR, value: {{ .Values.computers.nodeSelector | toJson | quote }}}
            - {name: COMPUTER_TOLERATIONS, value: {{ .Values.computers.tolerations | toJson | quote }}}
            - {name: COMPUTER_IMAGE_PULL_SECRETS, value: {{ .Values.computers.imagePullSecrets | toJson | quote }}}
          ports:
            - {name: http, containerPort: 47094}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources: {{ toYaml .Values.computerd.resources | nindent 12 }}
