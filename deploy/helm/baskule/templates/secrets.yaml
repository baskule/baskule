{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "baskule.secretName" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "baskule.labels" . | nindent 4 }}
type: Opaque
data:
  {{- include "baskule.secretData" . | nindent 2 }}
{{- end }}
{{- if not .Values.s3.existingSecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "baskule.s3SecretName" .) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "baskule.s3SecretName" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "baskule.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and .Values.rustfs.enabled $existing }}
  {{- toYaml $existing.data | nindent 2 }}
  {{- else if .Values.rustfs.enabled }}
  AWS_ACCESS_KEY_ID: {{ randAlphaNum 32 | b64enc | quote }}
  AWS_SECRET_ACCESS_KEY: {{ randAlphaNum 64 | sha256sum | b64enc | quote }}
  {{- else }}
  AWS_ACCESS_KEY_ID: {{ required "s3.accessKeyId or s3.existingSecret required" .Values.s3.accessKeyId | b64enc | quote }}
  AWS_SECRET_ACCESS_KEY: {{ required "s3.secretAccessKey or s3.existingSecret required" .Values.s3.secretAccessKey | b64enc | quote }}
  {{- end }}
{{- end }}
