{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "baskule.secretName" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "baskule.labels" . | nindent 4 }}
type: Opaque
data:
  {{- include "baskule.secretData" . | nindent 2 }}
{{- end }}
{{- if not .Values.s3.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "baskule.s3SecretName" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "baskule.labels" . | nindent 4 }}
type: Opaque
data:
  AWS_ACCESS_KEY_ID: {{ required "s3.accessKeyId or s3.existingSecret required" .Values.s3.accessKeyId | b64enc | quote }}
  AWS_SECRET_ACCESS_KEY: {{ required "s3.secretAccessKey or s3.existingSecret required" .Values.s3.secretAccessKey | b64enc | quote }}
{{- end }}
