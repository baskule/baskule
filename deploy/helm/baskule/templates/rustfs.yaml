{{- if .Values.rustfs.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-rustfs
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: rustfs}
  ports:
    - {name: s3, port: 3900}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-rustfs
spec:
  serviceName: {{ .Release.Name }}-rustfs
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: rustfs}
  template:
    metadata:
      labels:
        {{- include "baskule.labels" . | nindent 8 }}
        app.kubernetes.io/component: rustfs
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: rustfs
          image: {{ .Values.rustfs.image }}
          args: [/data]
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: {{ include "baskule.s3SecretName" . }}, key: AWS_ACCESS_KEY_ID}
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: {{ include "baskule.s3SecretName" . }}, key: AWS_SECRET_ACCESS_KEY}
            - {name: RUSTFS_ADDRESS, value: "0.0.0.0:3900"}
            - {name: RUSTFS_CONSOLE_ENABLE, value: "false"}
          ports:
            - {name: s3, containerPort: 3900}
          readinessProbe:
            httpGet: {path: /health/ready, port: s3}
          resources: {{ toYaml .Values.rustfs.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.rustfs.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.rustfs.storage }}}
{{- end }}
