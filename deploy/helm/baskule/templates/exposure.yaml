{{- $host := get (urlParse .Values.publicUrl) "host" | splitList ":" | first }}
{{- if eq .Values.exposure.mode "ingress" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations:
    {{- $defaults := dict "nginx.ingress.kubernetes.io/proxy-body-size" "1g" "nginx.ingress.kubernetes.io/proxy-request-buffering" "off" "nginx.ingress.kubernetes.io/proxy-buffering" "off" "nginx.ingress.kubernetes.io/proxy-read-timeout" "3600" "nginx.ingress.kubernetes.io/proxy-send-timeout" "3600" }}
    {{- toYaml (mergeOverwrite $defaults .Values.exposure.ingress.annotations) | nindent 4 }}
spec:
  {{- with .Values.exposure.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.exposure.ingress.tls }}
  tls: {{ toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: {{ .Release.Name }}, port: {number: 80}}
{{- else if eq .Values.exposure.mode "gateway" }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
spec:
  parentRefs:
    - name: {{ required "exposure.gateway.name required" .Values.exposure.gateway.name }}
      {{- with .Values.exposure.gateway.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .Values.exposure.gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames: [{{ $host | quote }}]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      timeouts: {request: 3600s, backendRequest: 3600s}
      backendRefs:
        - {name: {{ .Release.Name }}, port: 80}
{{- end }}
