# Public origin, including scheme. Use HTTPS outside a local evaluation.
publicUrl: http://localhost:47090
replicas: 2
global:
  image:
    registry: ghcr.io/baskule
    tag: "0.0.0" # updated when packaging the release
    pullPolicy: IfNotPresent
imagePullSecrets: []
# Keys: COMPUTERD_TOKEN, SETUP_TOKEN, PLUGIN_SYNC_TOKEN. Generated once with Helm server lookup.
# GitOps/client rendering must supply existingSecret and s3.existingSecret.
existingSecret: ""
authConfig: '{"version":1,"mode":"authenticated","password":true}'
s3:
  endpoint: ""
  region: us-east-1
  bucket: ""
  # Prefer an existing Secret with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
  existingSecret: ""
  # Supplied keys are reapplied on upgrade when no existing Secret is selected.
  accessKeyId: ""
  secretAccessKey: ""
celld:
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}
  heapLimitMb: 1024
  terminationGracePeriodSeconds: 50
computerd:
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}
computer:
  cpu: "2"
  memory: 3Gi
exposure:
  # none (port-forward), ingress, or gateway. Controller installed separately.
  mode: none
  serviceAnnotations: {}
  ingress:
    className: ""
    annotations: {}
    tls: []
  gateway:
    name: ""
    namespace: ""
    sectionName: ""
networkPolicy:
  enabled: true
# The vendored OpenShell chart owns the gateway, RBAC, JWT and workspace PVCs.
openshell:
  gatewayConfig:
    openshell.drivers.kubernetes:
      allowed_pod_labels: [baskule.managed, baskule.instance]
  gateway:
    image: {repository: baskule-openshell-kubernetes}
  sandboxRuntime:
    image: {repository: baskule-openshell-sandbox}
  supervisor:
    image: {repository: baskule-openshell-supervisor}
  server:
    telemetryEnabled: false
    disableTls: true
    auth:
      allowUnauthenticatedUsers: true # private service; NetworkPolicy restricts clients
    sandboxUid: "1000"
    sandboxGid: "1000"
    workspaceDefaultStorageSize: 10Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
