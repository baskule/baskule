# Public origin, including scheme. Use HTTPS outside a local evaluation.
publicUrl: http://localhost:47090
replicas: 2
global:
  image:
    registry: ghcr.io/baskule
    tag: "0.0.0" # updated when packaging the release
    pullPolicy: IfNotPresent
imagePullSecrets: []
# Keys: COMPUTERD_TOKEN, SETUP_TOKEN. Generated once with Helm server lookup.
# GitOps/client rendering must supply existingSecret for platform tokens.
# Prefer s3.existingSecret to keep bucket keys outside rendered manifests.
existingSecret: ""
authConfig: '{"version":1,"mode":"authenticated","password":true}'
s3:
  endpoint: ""
  region: us-east-1
  bucket: ""
  # Prefer an existing Secret with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
  existingSecret: ""
  # Supplied keys are reapplied on upgrade when no existing Secret is selected.
  accessKeyId: ""
  secretAccessKey: ""
celld:
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}
  heapLimitMb: 1024
  # Seconds before idle eviction; set 0 explicitly to preserve disabled eviction on upgrade.
  idleEvictSeconds: 900
  terminationGracePeriodSeconds: 50
computerd:
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}
exposure:
  # none (port-forward), ingress, or gateway. Controller installed separately.
  mode: none
  serviceAnnotations: {}
  ingress:
    className: ""
    annotations: {}
    tls: []
  gateway:
    name: ""
    namespace: ""
    sectionName: ""
networkPolicy:
  enabled: true
computers:
  image: ""
  cpus: "2"
  memory: 3Gi
  diskSize: 10Gi
  storageClass: ""
  runtimeClassName: ""
  nodeSelector: {}
  tolerations: []
  imagePullSecrets: []
  prePull:
    enabled: true
  dnsServerCidrs: []
  blockedCidrs: []
  ipv6: false
