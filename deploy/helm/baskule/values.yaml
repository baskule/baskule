# Public origin, including scheme. Use HTTPS outside a local evaluation.
publicUrl: http://localhost:47090
replicas: 2
global:
  image:
    registry: ghcr.io/baskule
    tag: "0.0.0" # updated when packaging the release
    pullPolicy: IfNotPresent
imagePullSecrets: []
# Keys: COMPUTERD_TOKEN, SETUP_TOKEN, PLUGIN_SYNC_TOKEN. Generated once with Helm server lookup.
# GitOps/client rendering must supply existingSecret and s3.existingSecret.
existingSecret: ""
authConfig: '{"version":1,"mode":"authenticated","password":true}'
s3:
  endpoint: ""
  region: us-east-1
  bucket: baskule
  # Prefer an existing Secret with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
  existingSecret: ""
  # Supplied external keys are reapplied on upgrade; RustFS generates and retains its own.
  accessKeyId: ""
  secretAccessKey: ""
celld:
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}
  heapLimitMb: 1024
  terminationGracePeriodSeconds: 50
computerd:
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}
exposure:
  # none (port-forward), ingress, or gateway. Controller installed separately.
  mode: none
  serviceAnnotations: {}
  ingress:
    className: ""
    annotations: {}
    tls: []
  gateway:
    name: ""
    namespace: ""
    sectionName: ""
networkPolicy:
  enabled: true
# Single-node RustFS is for evaluation only. No redundancy or production SLA.
rustfs:
  enabled: false
  image: rustfs/rustfs@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
  storage: 10Gi
  storageClass: ""
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {cpu: "1", memory: 2Gi}
computers:
  image: ""
  cpus: "2"
  memory: 3Gi
  diskSize: 10Gi
  storageClass: ""
  runtimeClassName: ""
  nodeSelector: {}
  tolerations: []
  imagePullSecrets: []
  prePull:
    enabled: true
  blockedCidrs: []
  ipv6: false
