# Released installation. See docs/install.md. Source builds add docker-compose.build.yml.
name: baskule

# The fleet shares one bucket. Local RustFS is ready by default; S3_* selects an external bucket.
x-s3: &s3
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-${RUSTFS_ACCESS_KEY:-}}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-${RUSTFS_SECRET_KEY:-}}
  AWS_REGION: ${S3_REGION:-us-east-1}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://baskule-rustfs:47093}
  CELLD_BUCKET_NAME: ${CELLD_BUCKET_NAME:-baskule}
  CELLD_BUCKET: s3://${CELLD_BUCKET_NAME:-baskule}

x-celld-env: &celld-env
  <<: *s3
  CELLD_TRUST_FORWARDED_HEADERS: "1"
  CELLD_V8_HEAP_LIMIT_MB: ${CELLD_V8_HEAP_LIMIT_MB:-1024}
  # Outbound fetches include LLM streams and computerd exec streams: allow long ones.
  CELLD_FETCH_TIMEOUT_S: ${CELLD_FETCH_TIMEOUT_S:-3600}
  CELLD_MAX_ASSET_FILE_BYTES: ${CELLD_MAX_ASSET_FILE_BYTES:-536870912}
  # Traces of every request, cell turn and storage operation go to baskule-traces ("0": off).
  CELLD_OTEL: ${BASKULE_CELLD_OTEL:-0}
  DO_NOT_TRACK: "1"
  RUST_LOG: ${CELLD_RUST_LOG:-info}

x-celld-node: &celld-node
  image: ${BASKULE_REGISTRY:-ghcr.io/baskule}/baskule-celld:${BASKULE_VERSION:-0.5.0}
  restart: unless-stopped
  entrypoint: ["baskule-celld-job", "run", "celld"]
  env_file: &optional-env
    - path: .env
      required: false
  networks: [baskule-net]
  depends_on:
    baskule-bootstrap:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://127.0.0.1:47091/.well-known/celld/health"]
    interval: 5s
    timeout: 3s
    start_period: 60s
    start_interval: 1s
    retries: 3
  # SIGTERM = graceful handoff of the node's cells (up to 40 s).
  stop_grace_period: 50s
  cpus: ${CELLD_CPUS:-2}
  mem_limit: ${CELLD_MEMORY:-3g}

services:
  setup:
    image: ${BASKULE_REGISTRY:-ghcr.io/baskule}/baskule-celld:${BASKULE_VERSION:-0.5.0}
    entrypoint: ["baskule-celld-job", "setup"]
    restart: "no"
    environment:
      BASKULE_EDGE: ${BASKULE_EDGE:-http}
      BASKULE_DOMAIN: ${BASKULE_DOMAIN:-}
      PUBLIC_URL: ${PUBLIC_URL:-${BASKULE_DOMAIN:+https://}${BASKULE_DOMAIN:-http://127.0.0.1:${BASKULE_PORT:-47090}}}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      SETUP_STATUS_URL: http://baskule-celld-a:47091/api/baskule/setup
    volumes:
      - baskule-platform-secrets:/run/baskule/platform:ro
    networks: [baskule-net]
    depends_on:
      baskule-deploy:
        condition: service_completed_successfully

  baskule-rustfs:
    image: rustfs/rustfs@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "i=0; until [ -f /run/baskule/secrets ]; do i=$$((i+1)); [ $$i -lt 300 ] || exit 1; sleep 0.2; done; . /run/baskule/secrets; exec /entrypoint.sh rustfs /data"]
    depends_on:
      baskule-bootstrap:
        condition: service_started
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:47093
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-}
    volumes:
      - baskule-rustfs:/data
      - baskule-storage-secrets:/run/baskule:ro
    networks: [baskule-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:47093/health/ready"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      start_interval: 1s
      retries: 3
    cpus: 1
    mem_limit: 1g

  # Generate scoped secrets before waiting for the configured bucket. RustFS starts alongside this job.
  baskule-bootstrap:
    image: ${BASKULE_REGISTRY:-ghcr.io/baskule}/baskule-celld:${BASKULE_VERSION:-0.5.0}
    entrypoint: ["baskule-celld-job", "bootstrap"]
    restart: "no"
    environment: *s3
    volumes:
      - baskule-storage-secrets:/run/baskule/storage
      - baskule-platform-secrets:/run/baskule/platform
      - baskule-computerd-secrets:/run/baskule/computerd
    networks: [baskule-net]

  baskule-celld-a:
    <<: *celld-node
    hostname: baskule-celld-a
    command: ["--listen", "0.0.0.0:47091", "--internal-listen", "0.0.0.0:47092", "--advertise", "baskule-celld-a:47092"]
    environment:
      <<: *celld-env
      CELLD_NODE: baskule-a
    volumes:
      - baskule-celld-a:/var/lib/celld
      - baskule-storage-secrets:/run/baskule/storage:ro

  baskule-celld-b:
    <<: *celld-node
    hostname: baskule-celld-b
    command: ["--listen", "0.0.0.0:47091", "--internal-listen", "0.0.0.0:47092", "--advertise", "baskule-celld-b:47092"]
    environment:
      <<: *celld-env
      CELLD_NODE: baskule-b
    volumes:
      - baskule-celld-b:/var/lib/celld
      - baskule-storage-secrets:/run/baskule/storage:ro

  # Deploy the platform bundled in the image, then ask every node to adopt it.
  baskule-deploy:
    image: ${BASKULE_REGISTRY:-ghcr.io/baskule}/baskule-celld:${BASKULE_VERSION:-0.5.0}
    entrypoint: ["baskule-celld-job", "deploy"]
    restart: "no"
    environment:
      <<: *s3
      CELLD_MAX_ASSET_FILE_BYTES: ${CELLD_MAX_ASSET_FILE_BYTES:-536870912}
      CELLD_NODES_INTERNAL: baskule-celld-a:47092 baskule-celld-b:47092
      SETUP_STATUS_URL: ""
      PUBLIC_ORIGINS: ${PUBLIC_ORIGINS:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      COMPUTERD_URL: ${COMPUTERD_URL:-http://baskule-computerd:47094}
      COMPUTERD_TOKEN: ${COMPUTERD_TOKEN:-}
      # T3's spans inside each SpaceCell (orchestration, provider turns, browser operations).
      OTLP_TRACES_URL: ${BASKULE_OTLP_TRACES_URL:-}
    env_file: *optional-env
    volumes:
      - baskule-storage-secrets:/run/baskule/storage:ro
      - baskule-platform-secrets:/run/baskule/platform:ro
      # Optional standard plugin tree; see docs/install.md#plugins-folder.
      # - ./plugins:/plugins:ro
    networks: [baskule-net]
    # Only the bucket is needed: a fresh node answers nothing (not even its health route) until a deployment exists.
    depends_on:
      baskule-bootstrap:
        condition: service_completed_successfully
      baskule-celld-a:
        condition: service_started
      baskule-celld-b:
        condition: service_started

  baskule-edge:
    extends:
      service: edge-${BASKULE_EDGE:-http}
    profiles: !reset []
    image: &edge-image caddy:2@sha256:25cdc846626b62d05f6b633b9b40c2c9f6ef89b515dc76133cefd920f7dbe562
    restart: unless-stopped
    volumes:
      - baskule-edge-data:/data
    configs:
      - source: edge
        target: /etc/caddy/Caddyfile
    environment:
      BASKULE_TRUSTED_PROXIES: ${BASKULE_TRUSTED_PROXIES:-}
      BASKULE_NODES_WORKER: baskule-celld-a:47091 baskule-celld-b:47091
    networks: [baskule-net]
    depends_on:
      setup:
        condition: service_completed_successfully
      baskule-deploy:
        condition: service_completed_successfully
      baskule-celld-a:
        condition: service_started
      baskule-celld-b:
        condition: service_started
    cpus: 1
    mem_limit: 256m

  # Inheritance templates select one edge. Starting with --profile '*' is unsupported.
  edge-http:
    image: *edge-image
    profiles: [edge-template]
    ports:
      - "${BASKULE_BIND:-127.0.0.1}:${BASKULE_PORT:-47090}:47090"
    environment:
      BASKULE_SITE: :47090
      BASKULE_AUTO_HTTPS: auto_https off

  edge-https:
    image: *edge-image
    profiles: [edge-template]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      BASKULE_SITE: "${BASKULE_DOMAIN:-} :47090"
      BASKULE_AUTO_HTTPS: ""

  baskule-computerd:
    image: ${BASKULE_REGISTRY:-ghcr.io/baskule}/baskule-computerd:${BASKULE_VERSION:-0.5.0}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", ". /run/baskule/secrets; exec node --disable-warning=ExperimentalWarning src/main.ts"]
    volumes:
      - baskule-computerd-secrets:/run/baskule:ro
      - /var/run/docker.sock:/var/run/docker.sock
    group_add: ["${DOCKER_GID:-999}"]
    environment:
      COMPUTERD_TOKEN: ${COMPUTERD_TOKEN:-}
      COMPUTERD_PORT: "47094"
      COMPUTER_BACKEND: docker
      COMPUTER_LEGACY_VOLUME: ${COMPOSE_PROJECT_NAME}_baskule-openshell-docker
      COMPUTERD_INSTANCE: ${COMPUTERD_INSTANCE:-${COMPOSE_PROJECT_NAME}}
      COMPUTER_NETWORK: ${COMPUTER_NETWORK:-baskule-computers}
      COMPUTER_GUARD_IMAGE: ${BASKULE_REGISTRY:-ghcr.io/baskule}/baskule-computerd:${BASKULE_VERSION:-0.5.0}
      COMPUTER_DNS: ${COMPUTER_DNS:-1.1.1.1,8.8.8.8}
      COMPUTER_IMAGE: ${BASKULE_REGISTRY:-ghcr.io/baskule}/baskule-computer:${BASKULE_VERSION:-0.5.0}
      COMPUTER_CPUS: ${COMPUTER_CPUS:-2}
      COMPUTER_MEMORY: ${COMPUTER_MEMORY:-3Gi}
      PRODUCT_SETTINGS_URL: http://baskule-edge:47090/api/baskule/runtime-settings
      LOG_LEVEL: ${COMPUTERD_LOG_LEVEL:-info}
      OTLP_TRACES_URL: ${BASKULE_OTLP_TRACES_URL:-}
    networks: [baskule-net]
    depends_on:
      baskule-bootstrap:
        condition: service_completed_successfully
      # Traces of the whole stack (celld, the T3 server in each cell): Jaeger, in memory. The UI
  # has its own loopback-default bind, independent of the edge.
  baskule-traces:
    profiles: [traces]
    image: jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    restart: unless-stopped
    command: ["--config", "/etc/jaeger/config.yaml"]
    environment:
      JAEGER_MAX_TRACES: ${BASKULE_TRACES_MAX:-20000}
    configs:
      - source: traces
        target: /etc/jaeger/config.yaml
    ports:
      - "${BASKULE_TRACES_BIND:-127.0.0.1}:${BASKULE_TRACES_PORT:-47098}:16686"
    networks: [baskule-net]
    cpus: 1
    mem_limit: ${BASKULE_TRACES_MEMORY:-1g}

  backup:
    profiles: [backup]
    image: ${BASKULE_REGISTRY:-ghcr.io/baskule}/baskule-celld:${BASKULE_VERSION:-0.5.0}
    entrypoint: [baskule-celld-job, backup]
    network_mode: none
    environment:
      COMPUTERD_INSTANCE: ${COMPUTERD_INSTANCE:-${COMPOSE_PROJECT_NAME}}
      BACKUP_IMAGE: ${BASKULE_REGISTRY:-ghcr.io/baskule}/baskule-celld:${BASKULE_VERSION:-0.5.0}
    logging:
      driver: none
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - baskule-storage-secrets:/backup/storage-secrets:ro
      - baskule-platform-secrets:/backup/platform-secrets:ro
      - baskule-computerd-secrets:/backup/computerd-secrets:ro
      - baskule-rustfs:/backup/rustfs:ro

  restore:
    profiles: [backup]
    image: ${BASKULE_REGISTRY:-ghcr.io/baskule}/baskule-celld:${BASKULE_VERSION:-0.5.0}
    entrypoint: [baskule-celld-job, restore]
    network_mode: none
    environment:
      COMPUTERD_INSTANCE: ${COMPUTERD_INSTANCE:-${COMPOSE_PROJECT_NAME}}
      BACKUP_IMAGE: ${BASKULE_REGISTRY:-ghcr.io/baskule}/baskule-celld:${BASKULE_VERSION:-0.5.0}
    logging:
      driver: none
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - baskule-storage-secrets:/backup/storage-secrets
      - baskule-platform-secrets:/backup/platform-secrets
      - baskule-computerd-secrets:/backup/computerd-secrets
      - baskule-rustfs:/backup/rustfs

networks:
  baskule-net: {}

volumes:
  baskule-storage-secrets: {}
  baskule-platform-secrets: {}
  baskule-computerd-secrets: {}
  baskule-rustfs: {}
  baskule-celld-a: {}
  baskule-celld-b: {}
  baskule-edge-data: {}
  baskule-openshell-docker: {}

configs:
  edge:
    content: |
      # baskule-edge: the only published port of the stack. Load-balances the celld nodes (any node can serve any
      # request: celld forwards to the owner of a cell). The selected edge serves local HTTP or automatic HTTPS.
      {
          admin off
          {$$BASKULE_AUTO_HTTPS}
          persist_config off
          servers {
              trusted_proxies static {$$BASKULE_TRUSTED_PROXIES}
              trusted_proxies_strict
          }
      }

      {$$BASKULE_SITE} {
          # Compress static and JSON responses only: streams (SSE text/event-stream, exec NDJSON) must never be buffered.
          encode {
              zstd
              gzip 6
              minimum_length 1024
              match {
                  header Content-Type text/html*
                  header Content-Type text/css*
                  header Content-Type text/javascript*
                  header Content-Type application/javascript*
                  header Content-Type application/json*
                  header Content-Type image/svg+xml*
                  header Content-Type application/wasm*
                  header Content-Type model/gltf-binary*
              }
          }
          # Vite assets are content-hashed: cache them for good (the HTML still revalidates).
          @assets path /assets/*
          header @assets >Cache-Control "public, max-age=31536000, immutable"
          reverse_proxy {$$BASKULE_NODES_WORKER} {
              lb_policy round_robin
              # Retry another node when a dial fails (node down, before the active check notices).
              lb_retries 2
              lb_try_duration 10s
              lb_try_interval 250ms
              fail_duration 10s
              health_uri /.well-known/celld/health
              health_interval 2s
              health_timeout 2s
              health_fails 2
              health_passes 1
              # The sign-in rate limit keys on the last X-Forwarded-For entry: set it to the real client address.
              header_up X-Forwarded-For {client_ip}
              # Stream responses (SSE, NDJSON) without buffering.
              flush_interval -1
              transport http {
                  dial_timeout 3s
                  keepalive 60s
              }
          }
          request_body {
              max_size 1GB
          }
          log {
              output stdout
              format console
              level WARN
          }
      }
  traces:
    content: |
      # Jaeger v2 (an OpenTelemetry Collector distribution) for the stack's traces: OTLP in (gRPC 4317, HTTP 4318),
      # in-memory storage capped by trace count (restarts start empty), UI and query API on 16686.
      service:
        extensions: [jaeger_storage, jaeger_query, healthcheckv2]
        pipelines:
          traces:
            receivers: [otlp]
            processors: [batch]
            exporters: [jaeger_storage_exporter]
        telemetry:
          logs:
            level: warn

      extensions:
        healthcheckv2:
          use_v2: true
          http:
            endpoint: 0.0.0.0:13133
        jaeger_query:
          storage:
            traces: memstore
          http:
            endpoint: 0.0.0.0:16686
        jaeger_storage:
          backends:
            memstore:
              memory:
                max_traces: $${env:JAEGER_MAX_TRACES:-20000}

      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

      processors:
        batch: {}

      exporters:
        jaeger_storage_exporter:
          trace_storage: memstore
