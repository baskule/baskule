# Released installation. See docs/install.md. Source builds add docker-compose.build.yml.
name: baskule

# The fleet shares one bucket. COMPOSE_PROFILES=storage enables the local RustFS service.
x-s3: &s3
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-${RUSTFS_ACCESS_KEY:-}}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-${RUSTFS_SECRET_KEY:-}}
  AWS_REGION: ${S3_REGION:-us-east-1}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://baskule-rustfs:47093}
  CELLD_BUCKET_NAME: ${CELLD_BUCKET_NAME:-baskule}
  CELLD_BUCKET: s3://${CELLD_BUCKET_NAME:-baskule}

x-celld-env: &celld-env
  <<: *s3
  CELLD_V8_HEAP_LIMIT_MB: ${CELLD_V8_HEAP_LIMIT_MB:-1024}
  # Outbound fetches include LLM streams and computerd exec streams: allow long ones.
  CELLD_FETCH_TIMEOUT_S: ${CELLD_FETCH_TIMEOUT_S:-3600}
  # The desktop AppImage is served as a static asset under /downloads (WP-C/WP-G): >= 200 MiB.
  CELLD_MAX_ASSET_FILE_BYTES: ${CELLD_MAX_ASSET_FILE_BYTES:-536870912}
  # Traces of every request, cell turn and storage operation go to baskule-traces ("0": off).
  CELLD_OTEL: ${BASKULE_CELLD_OTEL:-0}
  DO_NOT_TRACK: "1"
  RUST_LOG: ${CELLD_RUST_LOG:-info}

x-celld-node: &celld-node
  image: ${BASKULE_REGISTRY:-ghcr.io/baskule}/baskule-celld:${BASKULE_VERSION:-0.5.0}
  restart: unless-stopped
  networks: [baskule-net]
  depends_on:
    baskule-bootstrap:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://127.0.0.1:47091/.well-known/celld/health"]
    interval: 5s
    timeout: 3s
    start_period: 60s
    start_interval: 1s
    retries: 3
  # SIGTERM = graceful handoff of the node's cells (up to 40 s).
  stop_grace_period: 50s
  cpus: ${CELLD_CPUS:-2}
  mem_limit: ${CELLD_MEMORY:-3g}

services:
  baskule-rustfs:
    profiles: [storage]
    image: rustfs/rustfs@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    restart: unless-stopped
    command: ["rustfs", "/data"]
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:47093
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-}
    volumes:
      - baskule-rustfs:/data
    networks: [baskule-net]
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:47093/"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      start_interval: 1s
      retries: 3
    cpus: 1
    mem_limit: 1g

  # One-shot: create the fleet bucket (idempotent).
  baskule-bootstrap:
    image: ${BASKULE_REGISTRY:-ghcr.io/baskule}/baskule-celld:${BASKULE_VERSION:-0.5.0}
    entrypoint: ["baskule-celld-job", "bootstrap"]
    restart: "no"
    environment: *s3
    networks: [baskule-net]

  baskule-celld-a:
    <<: *celld-node
    hostname: baskule-celld-a
    command: ["--listen", "0.0.0.0:47091", "--internal-listen", "0.0.0.0:47092", "--advertise", "baskule-celld-a:47092"]
    environment:
      <<: *celld-env
      CELLD_NODE: baskule-a
    volumes:
      - baskule-celld-a:/var/lib/celld

  baskule-celld-b:
    <<: *celld-node
    hostname: baskule-celld-b
    command: ["--listen", "0.0.0.0:47091", "--internal-listen", "0.0.0.0:47092", "--advertise", "baskule-celld-b:47092"]
    environment:
      <<: *celld-env
      CELLD_NODE: baskule-b
    volumes:
      - baskule-celld-b:/var/lib/celld

  # Deploy the platform bundled in the image, then ask every node to adopt it.
  baskule-deploy:
    image: ${BASKULE_REGISTRY:-ghcr.io/baskule}/baskule-celld:${BASKULE_VERSION:-0.5.0}
    entrypoint: ["baskule-celld-job", "deploy"]
    restart: "no"
    environment:
      <<: *s3
      # `celld deploy` checks asset sizes too (desktop artifacts under /downloads).
      CELLD_MAX_ASSET_FILE_BYTES: ${CELLD_MAX_ASSET_FILE_BYTES:-536870912}
      DEPLOY_APP: platform
      CELLD_NODES_INTERNAL: baskule-celld-a:47092 baskule-celld-b:47092
      PUBLIC_ORIGINS: ${PUBLIC_ORIGINS:-http://127.0.0.1:47090}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      COMPUTERD_URL: ${COMPUTERD_URL:-http://baskule-computerd:47094}
      COMPUTERD_TOKEN: ${COMPUTERD_TOKEN:?set COMPUTERD_TOKEN in .env}
      # T3's spans inside each SpaceCell (orchestration, provider turns, browser operations).
      OTLP_TRACES_URL: ${BASKULE_OTLP_TRACES_URL:-}
    env_file: .env
    volumes:
      - ./config:/src/config:ro
    networks: [baskule-net]
    # Only the bucket is needed: a fresh node answers nothing (not even its health route) until a deployment exists.
    depends_on:
      baskule-bootstrap:
        condition: service_completed_successfully
      baskule-celld-a:
        condition: service_started
      baskule-celld-b:
        condition: service_started

  baskule-edge:
    image: caddy:2@sha256:25cdc846626b62d05f6b633b9b40c2c9f6ef89b515dc76133cefd920f7dbe562
    restart: unless-stopped
    ports:
      - "${BASKULE_BIND:-127.0.0.1}:${BASKULE_PORT:-47090}:47090"
    volumes:
      - baskule-edge-data:/data
    configs:
      - source: edge
        target: /etc/caddy/Caddyfile
    environment:
      BASKULE_NODES_WORKER: baskule-celld-a:47091 baskule-celld-b:47091
    networks: [baskule-net]
    depends_on:
      baskule-deploy:
        condition: service_completed_successfully
      baskule-celld-a:
        condition: service_started
      baskule-celld-b:
        condition: service_started
    cpus: 1
    mem_limit: 256m

  baskule-computerd:
    image: ${BASKULE_REGISTRY:-ghcr.io/baskule}/baskule-computerd:${BASKULE_VERSION:-0.5.0}
    restart: unless-stopped
    environment:
      COMPUTERD_TOKEN: ${COMPUTERD_TOKEN}
      COMPUTERD_PORT: "47094"
      OPENSHELL_GATEWAY: baskule-openshell:47095
      OPENSHELL_VOLUMES_URL: http://baskule-openshell:47096
      OPENSHELL_VOLUMES_TOKEN: ${OPENSHELL_VOLUMES_TOKEN:?set OPENSHELL_VOLUMES_TOKEN in .env}
      COMPUTER_IMAGE: ${BASKULE_REGISTRY:-ghcr.io/baskule}/baskule-computer:${BASKULE_VERSION:-0.5.0}
      COMPUTER_CPUS: ${COMPUTER_CPUS:-2}
      COMPUTER_MEMORY: ${COMPUTER_MEMORY:-3Gi}
      PRODUCT_SETTINGS_URL: http://baskule-edge:47090/api/baskule/runtime-settings
      LOG_LEVEL: ${COMPUTERD_LOG_LEVEL:-info}
      OTLP_TRACES_URL: ${BASKULE_OTLP_TRACES_URL:-}
    networks: [baskule-net, baskule-computers]
    depends_on:
      baskule-openshell:
        condition: service_healthy
    cpus: 1
    mem_limit: 512m

  baskule-openshell:
    image: ${BASKULE_REGISTRY:-ghcr.io/baskule}/baskule-openshell-gateway:${BASKULE_VERSION:-0.5.0}
    restart: unless-stopped
    # First start imports the bundled computer into the private daemon.
    healthcheck:
      start_period: 10m
    # Privileged: it runs its own dockerd (unix socket only, no bridge, no iptables). The computers run inside it.
    privileged: true
    environment:
      OPENSHELL_VOLUMES_TOKEN: ${OPENSHELL_VOLUMES_TOKEN}
      OPENSHELL_OTLP_ENDPOINT: ${BASKULE_OPENSHELL_OTLP:-}
      BASKULE_REGISTRY: ${BASKULE_REGISTRY:-ghcr.io/baskule}
      BASKULE_VERSION: ${BASKULE_VERSION:-0.5.0}
    volumes:
      - baskule-openshell-docker:/var/lib/docker
      - baskule-openshell-state:/var/lib/openshell
    networks: [baskule-computers]
    stop_grace_period: 60s
    cpus: ${OPENSHELL_CPUS:-3}
    mem_limit: ${OPENSHELL_MEMORY:-8g}
    pids_limit: 16384

  # Traces of the whole stack (celld, the T3 server in each cell, the OpenShell gateway): Jaeger, in memory. The UI
  # listens on the configured private bind address, like the edge.
  baskule-traces:
    profiles: [traces]
    image: jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    restart: unless-stopped
    command: ["--config", "/etc/jaeger/config.yaml"]
    environment:
      JAEGER_MAX_TRACES: ${BASKULE_TRACES_MAX:-20000}
    configs:
      - source: traces
        target: /etc/jaeger/config.yaml
    ports:
      - "${BASKULE_BIND:-127.0.0.1}:${BASKULE_TRACES_PORT:-47098}:16686"
    networks: [baskule-net, baskule-computers]
    cpus: 1
    mem_limit: ${BASKULE_TRACES_MEMORY:-1g}

  backup:
    profiles: [backup]
    image: ${BASKULE_REGISTRY:-ghcr.io/baskule}/baskule-celld:${BASKULE_VERSION:-0.5.0}
    entrypoint: [baskule-celld-job, backup]
    network_mode: none
    volumes:
      - baskule-rustfs:/backup/rustfs:ro
      - baskule-openshell-state:/backup/openshell-state:ro
      - baskule-openshell-docker:/backup/openshell-docker:ro

  restore:
    profiles: [backup]
    image: ${BASKULE_REGISTRY:-ghcr.io/baskule}/baskule-celld:${BASKULE_VERSION:-0.5.0}
    entrypoint: [baskule-celld-job, restore]
    network_mode: none
    volumes:
      - baskule-rustfs:/backup/rustfs
      - baskule-openshell-state:/backup/openshell-state
      - baskule-openshell-docker:/backup/openshell-docker

networks:
  baskule-net: {}
  baskule-computers: {}

volumes:
  baskule-rustfs: {}
  baskule-celld-a: {}
  baskule-celld-b: {}
  baskule-edge-data: {}
  baskule-openshell-docker: {}
  baskule-openshell-state: {}

configs:
  edge:
    content: |
      # baskule-edge: the only published port of the stack. Load-balances the celld nodes (any node can serve any
      # request: celld forwards to the owner of a cell). Plain HTTP behind the HTTPS reverse proxy.
      {
          admin off
          auto_https off
          persist_config off
          # Clients connect directly: never trust an inbound X-Forwarded-For.
      }

      :47090 {
          # Compress static and JSON responses only: streams (SSE text/event-stream, exec NDJSON) must never be buffered.
          encode {
              zstd
              gzip 6
              minimum_length 1024
              match {
                  header Content-Type text/html*
                  header Content-Type text/css*
                  header Content-Type text/javascript*
                  header Content-Type application/javascript*
                  header Content-Type application/json*
                  header Content-Type image/svg+xml*
                  header Content-Type application/wasm*
                  header Content-Type model/gltf-binary*
              }
          }
          # Vite assets are content-hashed: cache them for good (the HTML still revalidates).
          @assets path /assets/*
          header @assets >Cache-Control "public, max-age=31536000, immutable"
          reverse_proxy {$$BASKULE_NODES_WORKER} {
              lb_policy round_robin
              # Retry another node when a dial fails (node down, before the active check notices).
              lb_retries 2
              lb_try_duration 10s
              lb_try_interval 250ms
              fail_duration 10s
              health_uri /.well-known/celld/health
              health_interval 2s
              health_timeout 2s
              health_fails 2
              health_passes 1
              # The sign-in rate limit keys on the last X-Forwarded-For entry: set it to the real client address.
              header_up X-Forwarded-For {remote_host}
              header_up X-Forwarded-Proto {scheme}
              # Stream responses (SSE, NDJSON) without buffering.
              flush_interval -1
              transport http {
                  dial_timeout 3s
                  keepalive 60s
              }
          }
          request_body {
              max_size 1GB
          }
          log {
              output stdout
              format console
              level WARN
          }
      }
  traces:
    content: |
      # Jaeger v2 (an OpenTelemetry Collector distribution) for the stack's traces: OTLP in (gRPC 4317, HTTP 4318),
      # in-memory storage capped by trace count (restarts start empty), UI and query API on 16686.
      service:
        extensions: [jaeger_storage, jaeger_query, healthcheckv2]
        pipelines:
          traces:
            receivers: [otlp]
            processors: [batch]
            exporters: [jaeger_storage_exporter]
        telemetry:
          logs:
            level: warn

      extensions:
        healthcheckv2:
          use_v2: true
          http:
            endpoint: 0.0.0.0:13133
        jaeger_query:
          storage:
            traces: memstore
          http:
            endpoint: 0.0.0.0:16686
        jaeger_storage:
          backends:
            memstore:
              memory:
                max_traces: $${env:JAEGER_MAX_TRACES:-20000}

      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

      processors:
        batch: {}

      exporters:
        jaeger_storage_exporter:
          trace_storage: memstore
