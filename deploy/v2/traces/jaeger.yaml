# Jaeger v2 (an OpenTelemetry Collector distribution) for the stack's traces: OTLP in (gRPC 4317, HTTP 4318),
# in-memory storage capped by trace count (restarts start empty), UI and query API on 16686.
service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    logs:
      level: warn

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133
  jaeger_query:
    storage:
      traces: memstore
    http:
      endpoint: 0.0.0.0:16686
  jaeger_storage:
    backends:
      memstore:
        memory:
          max_traces: ${env:JAEGER_MAX_TRACES:-20000}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  jaeger_storage_exporter:
    trace_storage: memstore
