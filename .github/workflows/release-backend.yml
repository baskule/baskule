name: Release backend

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  backend-build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASKULE_VERSION: ${{ inputs.version }}
      BASKULE_STACK_PROXY: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Download release translations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: translations
          path: app
      - name: Download the verified hosted web bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hosted-web-${{ inputs.version }}
          path: .run/release/hosted-web
      - name: Download runtime image archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-runtime-${{ inputs.version }}
          path: .run/release/runtime
      - id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Export BuildKit cache credentials
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            for (const key of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
              core.exportVariable(key, process.env[key]);
              core.setSecret(process.env[key]);
            }
      - uses: ./.github/actions/setup
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0
      - name: Package celld with verified web and retained runtime archives
        env:
          BASKULE_DOCKER_CACHE: '1'
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: scripts/ci/backend.sh package
      - name: Upload backend artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-${{ inputs.version }}
          path: .run/release/backend/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Preserve backend evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-evidence-${{ inputs.version }}
          path: |
            .run/evidence/release/
            .run/evidence/release-install/
            .run/evidence/kubernetes/
            !.run/evidence/kubernetes/**/*.private
            !.run/evidence/release-install/*.tar.gz
            .run/check/
            .run/web-mock/artifacts/
            e2e/test-results/
            .run/journeys/results/**/test-failed-*.png
            .run/journeys/results/**/error-context.md
          if-no-files-found: warn
          retention-days: 1

  backend-checks:
    needs: backend-build
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.suite == 'kubernetes' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: worker-space
            suite: components
            selection: worker space
          - name: computerd
            suite: components
            selection: computerd agent
          - name: contracts
            suite: components
            selection: features
          - name: journeys-1
            suite: journeys
            selection: 1/4
          - name: journeys-2
            suite: journeys
            selection: 2/4
          - name: journeys-3
            suite: journeys
            selection: 3/4
          - name: journeys-4
            suite: journeys
            selection: 4/4
          - name: install-kubernetes
            suite: kubernetes
            selection: kubernetes
          - name: install-single
            suite: install
            selection: single
          - name: install-folder
            suite: install
            selection: folder
          - name: install-proxy
            suite: install
            selection: proxy
          - name: install-https
            suite: install
            selection: https
          - name: install-external
            suite: install
            selection: external
    env:
      BASKULE_VERSION: ${{ inputs.version }}
      BASKULE_STACK_PROXY: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Make room for image verification
        shell: bash
        run: |
          [[ $RUNNER_ENVIRONMENT == github-hosted ]]
          if (( $(df --output=avail -B1 . | tail -1) < 35000000000 )); then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          fi
          df -h .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: translations
          path: app
      - uses: ./.github/actions/setup
      - name: Download the archives that will be published
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-${{ inputs.version }}
          path: .run/release/backend
      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        if: matrix.suite == 'kubernetes'
        with:
          install_only: true
          version: v0.30.0
          kubectl_version: v1.34.1
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        if: matrix.suite == 'kubernetes'
        with:
          version: v3.19.0
      - name: Run isolated fake-model checks
        env:
          SUITE: ${{ matrix.suite }}
          SELECTION: ${{ matrix.selection }}
        run: |
          read -ra selection <<< "$SELECTION"
          scripts/ci/backend.sh "$SUITE" "${selection[@]}"
      - name: Preserve backend evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-evidence-${{ inputs.version }}-${{ matrix.name }}
          path: |
            .run/evidence/release/
            .run/evidence/release-install/
            .run/evidence/kubernetes/
            !.run/evidence/kubernetes/**/*.private
            !.run/evidence/release-install/*.tar.gz
            .run/check/
            e2e/test-results/
            .run/journeys/results/
          if-no-files-found: warn
          retention-days: 1
