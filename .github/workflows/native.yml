name: Native clients

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native lane to run
        type: choice
        options: [all, android, ios, desktop, windows-tests]
        default: all
      version:
        description: Package version
        type: string
        default: '0.0.0'
      sign:
        description: Sign Android/desktop with owner credentials (default branch and protected native-release environment only)
        type: boolean
        default: false
      windows_test_package:
        description: Optional Windows diagnostic workspace; empty runs all non-server only when platform=windows-tests
        type: string
        default: ''
      windows_test_files:
        description: Space-separated test files relative to that package (optional)
        type: string
        default: ''
  workflow_call:
    inputs:
      platform:
        type: string
        default: all
      version:
        type: string
        default: '0.0.0'
      sign:
        type: boolean
        default: false
      windows_test_package:
        type: string
        default: ''
      windows_test_files:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: false

env:
  CI: '1'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  T3CODE_TELEMETRY_ENABLED: 'false'
  BASKULE_CHECK_RECORD: '0'
  NATIVE_VERSION: ${{ inputs.version }}
  BASKULE_MOBILE_BUILD_NUMBER: ${{ github.run_number }}
  NATIVE_SIGN: ${{ inputs.sign || false }}

jobs:
  android:
    if: inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: ${{ inputs.sign && 'native-release' || 'native-ci' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require trusted branch for signing
        if: inputs.sign
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_EVENT_NAME" = workflow_dispatch && test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.10.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21.0.13+9.0.LTS
      - name: Reclaim unused hosted-runner toolchains for the native build
        run: sudo rm -rf /usr/share/dotnet /usr/local/.ghcup
      - name: Install pinned Android SDK packages
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools platforms;android-37.0 platforms;android-36
            build-tools;37.0.0 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1
      - name: Install frozen mobile dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile --filter @t3tools/monorepo --filter @t3tools/mobile...
      - name: Compile Android arm64 Release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ inputs.sign && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ inputs.sign && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ inputs.sign && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ inputs.sign && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: scripts/ci/native-android.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-android-arm64-${{ inputs.version }}
          path: .run/native/android/*
          if-no-files-found: error
          retention-days: 1

  ios:
    if: inputs.platform == 'all' || inputs.platform == 'ios'
    # Standard public-preview runner; pinned to the SDK used by current native modules.
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.10.0
      - name: Record Xcode and CocoaPods toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          pod --version
      - name: Install frozen mobile dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile --filter @t3tools/monorepo --filter @t3tools/mobile...
      - name: Compile, install and launch unsigned iOS Release simulator app
        run: scripts/ci/native-ios.sh
      - name: Preserve iOS build and simulator evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: evidence-ios-${{ inputs.version }}
          path: |
            .run/native/ios/build.xcresult/
            .run/native/ios/xcodebuild.log
            .run/native/ios/launch.txt
            .run/native/ios/launch.png
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-ios-simulator-${{ inputs.version }}
          path: |
            .run/native/ios/Baskule-ios-simulator-unsigned.zip
            .run/native/ios/STATUS.txt
            .run/native/ios/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  desktop:
    if: inputs.platform == 'all' || inputs.platform == 'desktop'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            platform: mac
            arch: arm64
            rust_target: aarch64-apple-darwin
          - runner: macos-26-intel
            platform: mac
            arch: x64
            rust_target: x86_64-apple-darwin
          - runner: windows-2025
            platform: win
            arch: x64
            rust_target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    environment: ${{ inputs.sign && 'native-release' || 'native-ci' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require trusted branch for signing
        if: inputs.sign
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_EVENT_NAME" = workflow_dispatch && test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.10.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.rust_target }}
      - name: Install Spectre MSVC libraries required by T3 preflight
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe -ArgumentList 'modify', '--installPath', "`"$installPath`"", '--add', 'Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre', '--quiet', '--norestart' -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) { throw 'Visual Studio Spectre library installation failed' }
      - name: Prepare owner Windows signing provider
        if: runner.os == 'Windows' && inputs.sign
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module TrustedSigning -MinimumVersion 0.5.0 -Force -AllowClobber -Repository PSGallery -Scope CurrentUser
          Import-Module TrustedSigning -MinimumVersion 0.5.0 -Force
          Get-Command Invoke-TrustedSigning -ErrorAction Stop
          $moduleRoots = @(
            [IO.Path]::Combine([Environment]::GetFolderPath('MyDocuments'), 'PowerShell', 'Modules'),
            [IO.Path]::Combine([Environment]::GetFolderPath('MyDocuments'), 'WindowsPowerShell', 'Modules')
          )
          $entries = @($moduleRoots + ($env:PSModulePath -split ';')) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          "PSModulePath=$($entries -join ';')" >> $env:GITHUB_ENV
      - name: Install frozen desktop build dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile --filter @t3tools/monorepo --filter @t3tools/desktop... --filter t3... --filter @t3tools/scripts...
      - name: Ensure Electron runtime
        working-directory: app
        run: pnpm exec vp run --filter @t3tools/desktop ensure:electron
      - name: Package native Electron client and run T3 payload probes
        env:
          CSC_LINK: ${{ inputs.sign && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.sign && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ inputs.sign && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ inputs.sign && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ inputs.sign && secrets.APPLE_API_ISSUER || '' }}
          APPLE_TEAM_ID: ${{ inputs.sign && secrets.APPLE_TEAM_ID || '' }}
          MACOS_PROVISIONING_PROFILE: ${{ inputs.sign && secrets.MACOS_PROVISIONING_PROFILE || '' }}
          T3CODE_CLERK_PASSKEY_RP_DOMAINS: ${{ inputs.sign && vars.MACOS_PASSKEY_RP_DOMAINS || '' }}
          AZURE_TENANT_ID: ${{ inputs.sign && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ inputs.sign && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ inputs.sign && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ inputs.sign && secrets.AZURE_TRUSTED_SIGNING_ENDPOINT || '' }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ inputs.sign && secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME || '' }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ inputs.sign && secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME || '' }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ inputs.sign && secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME || '' }}
        run: scripts/ci/native-desktop.sh '${{ matrix.platform }}' '${{ matrix.arch }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-desktop-${{ matrix.platform }}-${{ matrix.arch }}-${{ inputs.version }}
          path: |
            .run/native/desktop-${{ matrix.platform }}-${{ matrix.arch }}/*.dmg
            .run/native/desktop-${{ matrix.platform }}-${{ matrix.arch }}/*.exe
            .run/native/desktop-${{ matrix.platform }}-${{ matrix.arch }}/STATUS.txt
            .run/native/desktop-${{ matrix.platform }}-${{ matrix.arch }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  windows-tests:
    name: Optional upstream Windows diagnostic
    if: inputs.platform == 'windows-tests' || (inputs.platform == 'all' && inputs.windows_test_package != '')
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.10.0
      - name: Install frozen app dependencies
        run: pnpm install --frozen-lockfile
      - name: Ensure Electron runtime
        run: pnpm exec vp run --filter '@t3tools/desktop' ensure:electron
      - name: Execute upstream T3 Windows package tests
        env:
          TEST_PACKAGE: ${{ inputs.windows_test_package }}
          TEST_FILES: ${{ inputs.windows_test_files }}
        run: |
          $ErrorActionPreference = 'Stop'
          $package = $env:TEST_PACKAGE
          $files = $env:TEST_FILES
          if ($package -and ($package -notmatch '^(apps|packages)/[A-Za-z0-9_-]+$' -or !(Test-Path "$package/package.json"))) { throw 'Invalid workspace package directory' }
          if (!$package -and $files) { throw 'File selection requires a package' }
          if (!$package) {
            pnpm exec vp run --parallel --concurrency-limit 4 --filter '!t3' --filter '!@t3tools/monorepo' test
          } elseif (!$files) {
            pnpm exec vp run --filter "./$package" test
          } else {
            Set-Location $package
            pnpm exec vp test run @($files.Split(' ', [StringSplitOptions]::RemoveEmptyEntries))
          }
          exit $LASTEXITCODE
