name: Native clients

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native lane to run
        type: choice
        options: [all, android, ios, desktop, windows-tests]
        default: all
      version:
        description: Package version (blank uses VERSION)
        type: string
        default: ''
      sign:
        description: Sign Android/desktop with publisher signing credentials (main branch and protected native-release environment only)
        type: boolean
        default: false
      sign_macos:
        description: Sign and notarize macOS only (protected native-release environment)
        type: boolean
        default: false
      windows_test_package:
        description: Optional Windows diagnostic workspace; empty runs all non-server only when platform=windows-tests
        type: string
        default: ''
      windows_test_files:
        description: Space-separated test files relative to that package (optional)
        type: string
        default: ''
  workflow_call:
    inputs:
      translations:
        type: boolean
        default: false
      platform:
        type: string
        default: all
      version:
        type: string
        default: ''
      sign:
        type: boolean
        default: false
      sign_macos:
        type: boolean
        default: false
      windows_test_package:
        type: string
        default: ''
      windows_test_files:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: false

jobs:
  mobile:
    if: inputs.platform == 'all' || inputs.platform == 'android' || inputs.platform == 'ios'
    uses: ./.github/workflows/native-mobile.yml
    with:
      platform: ${{ inputs.platform }}
      version: ${{ inputs.version }}
      translations: ${{ inputs.translations || false }}
      sign: ${{ inputs.sign }}
    secrets: inherit

  desktop:
    if: inputs.platform == 'all' || inputs.platform == 'desktop' || inputs.platform == 'windows-tests'
    uses: ./.github/workflows/native-desktop.yml
    with:
      platform: ${{ inputs.platform }}
      version: ${{ inputs.version }}
      translations: ${{ inputs.translations || false }}
      sign: ${{ inputs.sign }}
      sign_macos: ${{ inputs.sign_macos }}
      windows_test_package: ${{ inputs.windows_test_package }}
      windows_test_files: ${{ inputs.windows_test_files }}
    secrets: inherit
