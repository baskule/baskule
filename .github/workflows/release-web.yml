name: Release hosted web

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  hosted-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASKULE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: translations
          path: app
      - uses: ./.github/actions/setup
      - name: Build and verify hosted web
        shell: bash
        run: |
          set -euo pipefail
          source scripts/env.sh
          mkdir -p .run/evidence/release .run/release/hosted-web
          (cd e2e && pnpm exec playwright install --with-deps chromium)
          (cd app/apps/web && pnpm exec playwright install chromium)
          scripts/check web --fresh 2>&1 | tee .run/evidence/release/web.log
          tar -czf .run/release/hosted-web/hosted-web.tar.gz -C app/apps/web/dist .
          (cd .run/release/hosted-web && sha256sum hosted-web.tar.gz > SHA256SUMS)
      - name: Upload verified hosted web
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-web-${{ inputs.version }}
          path: .run/release/hosted-web/
          if-no-files-found: error
          retention-days: 1
      - name: Preserve hosted web evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-web-evidence-${{ inputs.version }}
          path: |
            .run/evidence/release/
            .run/web-mock/artifacts/
            .run/web-mock-build.log
          if-no-files-found: warn
          retention-days: 1
