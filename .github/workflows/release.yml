name: Release factory

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer without v; blank uses VERSION'
        type: string
        required: false
      verify_only:
        description: 'Verify artifacts without publishing images or a GitHub release'
        type: boolean
        default: true
      include_native:
        description: 'Also build Android, iOS simulator, macOS and Windows packages'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: version
        name: Derive and validate source version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            version=${GITHUB_REF_NAME#v}
            [[ "$version" == "$(<VERSION)" ]] || { echo 'Tag version must match VERSION.' >&2; exit 1; }
          else
            version=${INPUT_VERSION:-$(<VERSION)}
          fi
          VERSION="$version" python3 - <<'PY'
          import os
          import re
          version = os.environ['VERSION']
          identifier = r'[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*'
          match = re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)' +
                               rf'(?:-(?P<pre>{identifier}))?(?:\+{identifier})?', version)
          if not match or any(part.isdigit() and len(part) > 1 and part.startswith('0')
                              for part in (match.group('pre') or '').split('.')):
              raise SystemExit('Expected a SemVer source version.')
          PY
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Report manual factory start on the source commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context='Release factory' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description='Full artifact verification is running.' --silent

  translate:
    needs: version
    runs-on: ubuntu-24.04
    # Only tag pushes use the key; manual runs package the committed catalogs.
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Translate missing release messages
        if: github.event_name == 'push'
        env:
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
          TRANSLATION_MODEL: ${{ vars.TRANSLATION_MODEL }}
          TRANSLATION_BASE_URL: ${{ vars.TRANSLATION_BASE_URL }}
        run: node app/scripts/localization.ts translate
      - name: Check release catalogs
        if: github.event_name == 'push'
        run: node app/scripts/localization.ts check
      - name: Upload release translations
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: translations
          path: |
            app/packages/shared/src/locales/
            app/apps/mobile/locales/
          if-no-files-found: error
          retention-days: 1
      - name: Push translations for review
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git add app/packages/shared/src/locales/ app/apps/mobile/locales/
          if git diff --cached --quiet; then
            exit 0
          fi
          branch="translations/v$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(i18n): translate v$VERSION"
          gh auth setup-git
          # The bot owns this branch; a rerun replaces it with the catalogs this run shipped.
          git push --force origin "HEAD:refs/heads/$branch"
          echo "[Review translations and create a PR]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1)" >> "$GITHUB_STEP_SUMMARY"

  backend-runtime:
    needs: [version, source-ci]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASKULE_VERSION: ${{ needs.version.outputs.version }}
      BASKULE_STACK_PROXY: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Make room for the native and musl builds
        shell: bash
        run: |
          set -euo pipefail
          [[ $RUNNER_ENVIRONMENT == github-hosted ]]
          df -h .
          # These are unrelated preinstalled SDKs on this disposable VM.
          if (( $(df --output=avail -B1 . | tail -1) < 35000000000 )); then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          fi
          df -h .
          available=$(df --output=avail -B1 . | tail -1)
          (( available >= 35000000000 )) || { echo 'Need 35 GB free for the cold backend build.' >&2; exit 1; }
      - id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Export BuildKit cache credentials
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            for (const key of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
              core.exportVariable(key, process.env[key]);
              core.setSecret(process.env[key]);
            }
      - uses: ./.github/actions/setup
      - name: Restore OpenShell native binaries
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .run/cache/openshell/target/baskule-source
            .run/cache/openshell/target/release/openshell
            .run/cache/openshell/target/release/openshell-gateway
            .run/cache/openshell/target/release/openshell-supervisor
          key: openshell-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deploy/build-env/Dockerfile', 'vendor/openshell/**', 'openshell/build.sh') }}
      - name: Build backend archives once
        env:
          BASKULE_DOCKER_CACHE: '1'
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: scripts/ci/backend.sh runtime
      - name: Save OpenShell native binaries
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .run/cache/openshell/target/baskule-source
            .run/cache/openshell/target/release/openshell
            .run/cache/openshell/target/release/openshell-gateway
            .run/cache/openshell/target/release/openshell-supervisor
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Upload backend artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-runtime-${{ needs.version.outputs.version }}
          path: .run/release/runtime/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Preserve backend evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-runtime-evidence-${{ needs.version.outputs.version }}
          path: |
            .run/evidence/release/
            .run/evidence/release-install/
            !.run/evidence/release-install/*.tar.gz
            .run/check/
            .run/web-mock/artifacts/
            e2e/test-results/
            .run/journeys/results/**/test-failed-*.png
            .run/journeys/results/**/error-context.md
          if-no-files-found: warn
          retention-days: 1

  backend-build:
    needs: [version, translate, hosted-web, backend-runtime]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASKULE_VERSION: ${{ needs.version.outputs.version }}
      BASKULE_STACK_PROXY: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Download release translations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: translations
          path: app
      - name: Download the verified hosted web bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hosted-web-${{ needs.version.outputs.version }}
          path: .run/release/hosted-web
      - name: Download runtime image archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-runtime-${{ needs.version.outputs.version }}
          path: .run/release/runtime
      - id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Export BuildKit cache credentials
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            for (const key of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
              core.exportVariable(key, process.env[key]);
              core.setSecret(process.env[key]);
            }
      - uses: ./.github/actions/setup
      - name: Package celld with verified web and retained runtime archives
        env:
          BASKULE_DOCKER_CACHE: '1'
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: scripts/ci/backend.sh package
      - name: Upload backend artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-${{ needs.version.outputs.version }}
          path: .run/release/backend/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Preserve backend evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-evidence-${{ needs.version.outputs.version }}
          path: |
            .run/evidence/release/
            .run/evidence/release-install/
            !.run/evidence/release-install/*.tar.gz
            .run/check/
            .run/web-mock/artifacts/
            e2e/test-results/
            .run/journeys/results/**/test-failed-*.png
            .run/journeys/results/**/error-context.md
          if-no-files-found: warn
          retention-days: 1

  source-ci:
    runs-on: ubuntu-24.04
    permissions:
      checks: read
    steps:
      - name: Require ordinary CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.name == "CI required" and .app.slug == "github-actions" and .conclusion == "success") | .id' > passed
          test -s passed || { echo 'Run CI on this exact source commit before releasing.' >&2; exit 1; }

  upstream:
    needs: translate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [server, web]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: translations
          path: app
      - uses: ./.github/actions/setup
      - name: Install Chromium for upstream browser tests
        if: matrix.suite == 'server'
        run: cd app/apps/server && pnpm exec playwright-core install --with-deps chromium
      - name: Run upstream unit suite
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          mkdir -p .run/evidence/release
          scripts/check "upstream:$SUITE" --fresh 2>&1 | tee .run/evidence/release/upstream.log
      - name: Preserve upstream evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-upstream-${{ matrix.suite }}-evidence
          path: .run/evidence/release/
          retention-days: 1

  backend-checks:
    needs: [version, backend-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: worker-space
            suite: components
            selection: worker space
          - name: gateway
            suite: components
            selection: computerd agent
          - name: contracts
            suite: components
            selection: features
          - name: journeys-1
            suite: journeys
            selection: 1/4
          - name: journeys-2
            suite: journeys
            selection: 2/4
          - name: journeys-3
            suite: journeys
            selection: 3/4
          - name: journeys-4
            suite: journeys
            selection: 4/4
          - name: install-single
            suite: install
            selection: single
          - name: install-folder
            suite: install
            selection: folder
          - name: install-cluster
            suite: install
            selection: cluster
          - name: install-proxy
            suite: install
            selection: proxy
          - name: install-https
            suite: install
            selection: https
          - name: install-external
            suite: install
            selection: external
    env:
      BASKULE_VERSION: ${{ needs.version.outputs.version }}
      BASKULE_STACK_PROXY: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Make room for image verification
        shell: bash
        run: |
          [[ $RUNNER_ENVIRONMENT == github-hosted ]]
          if (( $(df --output=avail -B1 . | tail -1) < 35000000000 )); then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          fi
          df -h .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: translations
          path: app
      - uses: ./.github/actions/setup
      - name: Download the archives that will be published
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-${{ needs.version.outputs.version }}
          path: .run/release/backend
      - name: Run isolated fake-model checks
        env:
          SUITE: ${{ matrix.suite }}
          SELECTION: ${{ matrix.selection }}
        run: |
          read -ra selection <<< "$SELECTION"
          scripts/ci/backend.sh "$SUITE" "${selection[@]}"
      - name: Preserve backend evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-evidence-${{ needs.version.outputs.version }}-${{ matrix.name }}
          path: |
            .run/evidence/release/
            .run/evidence/release-install/
            !.run/evidence/release-install/*.tar.gz
            .run/check/
            e2e/test-results/
            .run/journeys/results/
          if-no-files-found: warn
          retention-days: 1

  # Preserve the publication dependency: archives exist earlier, but are usable only
  # after every consumer and the exact source commit's ordinary CI have passed.
  backend:
    needs: [source-ci, backend-build, backend-checks, upstream]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every backend verification job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"

  hosted-web:
    needs: [version, translate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASKULE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: translations
          path: app
      - uses: ./.github/actions/setup
      - name: Build and verify hosted web
        shell: bash
        run: |
          set -euo pipefail
          source scripts/env.sh
          mkdir -p .run/evidence/release .run/release/hosted-web
          (cd e2e && pnpm exec playwright install --with-deps chromium)
          (cd app/apps/web && pnpm exec playwright install chromium)
          scripts/check web --fresh 2>&1 | tee .run/evidence/release/web.log
          tar -czf .run/release/hosted-web/hosted-web.tar.gz -C app/apps/web/dist .
          (cd .run/release/hosted-web && sha256sum hosted-web.tar.gz > SHA256SUMS)
      - name: Upload verified hosted web
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-web-${{ needs.version.outputs.version }}
          path: .run/release/hosted-web/
          if-no-files-found: error
          retention-days: 1
      - name: Preserve hosted web evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-web-evidence-${{ needs.version.outputs.version }}
          path: |
            .run/evidence/release/
            .run/web-mock/artifacts/
            .run/web-mock-build.log
          if-no-files-found: warn
          retention-days: 1

  linux-apps:
    needs: [version, translate, hosted-web]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BASKULE_VERSION: ${{ needs.version.outputs.version }}
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Download release translations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: translations
          path: app
      - uses: ./.github/actions/setup
      - name: Install native Linux packaging and headless tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-dev libxkbcommon-dev imagemagick \
            libgtk-3-0t64 libnss3 libasound2t64 libgbm1 xvfb xauth dbus-x11 locales
          sudo locale-gen en_US.UTF-8
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
      - name: Download the verified hosted web bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hosted-web-${{ needs.version.outputs.version }}
          path: .run/release/linux-apps
      - name: Verify hosted web transfer
        run: cd .run/release/linux-apps && sha256sum -c SHA256SUMS
      - name: Build and verify packaged Linux desktop
        shell: bash
        run: |
          set -euo pipefail
          source scripts/env.sh
          mkdir -p .run/evidence/release
          desktop/check.sh 2>&1 | tee .run/evidence/release/desktop-check.log
          desktop/build.sh 2>&1 | tee .run/evidence/release/desktop-build.log
          dbus-run-session -- xvfb-run -a node desktop/verify.mjs 2>&1 | tee .run/evidence/release/desktop-package.log
          cp desktop/release/*.AppImage .run/release/linux-apps/
          scripts/ci/artifacts.sh .run/release/linux-apps linux-apps
      - name: Upload Linux app artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-apps-${{ needs.version.outputs.version }}
          path: .run/release/linux-apps/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Preserve Linux app evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-apps-evidence-${{ needs.version.outputs.version }}
          path: |
            .run/evidence/release/
            .run/desktop-verification/
            .run/web-mock/artifacts/
            .run/web-mock-build.log
          if-no-files-found: warn
          retention-days: 1

  native:
    needs: [version, translate]
    if: github.ref_type == 'tag' || inputs.include_native == true
    uses: ./.github/workflows/native.yml
    with:
      version: ${{ needs.version.outputs.version }}
      platform: all
      sign: false
      translations: true
    secrets: inherit

  factory-status:
    needs: [version, backend, linux-apps, native]
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Report the complete manual factory result
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_RESULT: ${{ needs.version.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          LINUX_RESULT: ${{ needs.linux-apps.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          INCLUDE_NATIVE: ${{ inputs.include_native }}
        shell: bash
        run: |
          state=failure
          if [[ $VERSION_RESULT == success && $BACKEND_RESULT == success && $LINUX_RESULT == success &&
                ($NATIVE_RESULT == success || ($INCLUDE_NATIVE == false && $NATIVE_RESULT == skipped)) ]]; then
            state=success
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f "state=$state" -f context='Release factory' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Full artifact verification: $state." --silent

  publish:
    needs: [version, backend, linux-apps, native]
    if: >-
      always() && needs.version.result == 'success' && needs.backend.result == 'success' &&
      needs.linux-apps.result == 'success' &&
      (needs.native.result == 'success' || (github.ref_type != 'tag' && inputs.include_native == false && needs.native.result == 'skipped')) &&
      (github.event_name == 'push' || inputs.verify_only == false)
    runs-on: ubuntu-24.04
    concurrency:
      group: release-images-${{ needs.version.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-${{ needs.version.outputs.version }}
          path: artifacts/backend
      - name: Publish verified archives without overwriting release tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: scripts/ci/publish-images.sh artifacts/backend

  draft-release:
    needs: [version, backend, linux-apps, native, publish]
    if: >-
      always() && needs.publish.result == 'success' && needs.version.result == 'success' && needs.backend.result == 'success' &&
      needs.linux-apps.result == 'success' &&
      (needs.native.result == 'success' || (github.ref_type != 'tag' && inputs.include_native == false && needs.native.result == 'skipped')) &&
      (github.event_name == 'push' || inputs.verify_only == false)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-${{ needs.version.outputs.version }}
          path: artifacts/backend
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-apps-${{ needs.version.outputs.version }}
          path: artifacts/linux-apps
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.native.result == 'success'
        with:
          pattern: native-*-${{ needs.version.outputs.version }}
          path: artifacts/native
      - name: Verify transferred assets and assemble release
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          for kind in backend linux-apps; do
            directory="artifacts/$kind"
            (cd "$directory" && sha256sum -c SHA256SUMS)
            tar -czf "release/$kind-$VERSION-metadata.tar.gz" --exclude='*.tar.gz' --exclude='*.AppImage' -C "$directory" .
          done
          cp artifacts/backend/*.tar.gz artifacts/linux-apps/*.tar.gz artifacts/linux-apps/*.AppImage release/
          cp artifacts/backend/*.yml artifacts/backend/*.env.example release/
          if [[ -d artifacts/native ]]; then
            for directory in artifacts/native/*; do
              (cd "$directory" && sha256sum -c SHA256SUMS)
              tar -czf "release/$(basename "$directory")-metadata.tar.gz" \
                --exclude='*.apk' --exclude='*.dmg' --exclude='*.exe' --exclude='*.zip' -C "$directory" .
              while IFS= read -r -d '' package; do
                destination="release/$(basename "$package")"
                [[ ! -e $destination ]] || { echo "Duplicate release asset: $destination" >&2; exit 1; }
                cp "$package" "$destination"
              done < <(find "$directory" -type f \( -name '*.apk' -o -name '*.dmg' -o -name '*.exe' -o -name '*.zip' \) -print0)
            done
          fi
          (cd release && sha256sum * > SHA256SUMS)
          find release -type f -size +2147483647c -print -quit | while read -r oversized; do
            echo "Release asset exceeds GitHub's 2 GiB limit: $oversized" >&2
            exit 1
          done
      - name: Create draft after every verification job passes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "v$VERSION" release/* --draft --target "$SOURCE_COMMIT" \
            --title "Baskule $VERSION" \
            --notes 'Backend and Linux apps built and verified on GitHub-hosted Ubuntu 24.04. Includes single-machine and cluster Compose assets, three versioned GHCR images, Worker, SpaceCell, hosted web and a Linux x64 AppImage. The web app links to versioned GitHub release assets; app installers are not embedded in celld. When native verification is included, the draft also contains Windows x64, macOS arm64/x64, Android arm64 and iOS Simulator packages. Native STATUS metadata states signing and verification limits; the simulator ZIP is not an installable iPhone IPA. Checks use a fake LLM and disposable local stacks; no live installation or real provider was exercised.'
