name: Release factory

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: version
        name: Derive and validate source version
        shell: bash
        run: |
          set -euo pipefail
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            version=${GITHUB_REF_NAME#v}
            [[ "$version" == "$(<VERSION)" ]] || { echo 'Tag version must match VERSION.' >&2; exit 1; }
          else
            version=$(<VERSION)
          fi
          VERSION="$version" python3 - <<'PY'
          import os
          import re
          version = os.environ['VERSION']
          identifier = r'[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*'
          match = re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)' +
                               rf'(?:-(?P<pre>{identifier}))?(?:\+{identifier})?', version)
          if not match or any(part.isdigit() and len(part) > 1 and part.startswith('0')
                              for part in (match.group('pre') or '').split('.')):
              raise SystemExit('Expected a SemVer source version.')
          PY
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Report manual factory start on the source commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context='Release factory' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description='Full artifact verification is running.' --silent

  source-ci:
    uses: ./.github/workflows/ci.yml

  translate:
    needs: version
    runs-on: ubuntu-24.04
    # Only tag pushes use the key; manual runs package the committed catalogs.
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Translate missing release messages
        if: github.event_name == 'push'
        env:
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
          # The project's release translation provider; override with repository or environment variables.
          TRANSLATION_MODEL: ${{ vars.TRANSLATION_MODEL || 'gpt-6-luna' }}
          TRANSLATION_BASE_URL: ${{ vars.TRANSLATION_BASE_URL || 'https://api.openai.com/v1' }}
        run: node app/scripts/localization.ts translate
      - name: Check release catalogs
        if: github.event_name == 'push'
        run: node app/scripts/localization.ts check
      - name: Upload release translations
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: translations
          path: |
            app/packages/shared/src/locales/
            app/apps/mobile/locales/
          if-no-files-found: error
          retention-days: 1
      - name: Push translations for review
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git add app/packages/shared/src/locales/ app/apps/mobile/locales/
          if git diff --cached --quiet; then
            exit 0
          fi
          branch="translations/v$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(i18n): translate v$VERSION"
          gh auth setup-git
          # The bot owns this branch; a rerun replaces it with the catalogs this run shipped.
          git push --force origin "HEAD:refs/heads/$branch"
          echo "[Review translations and create a PR]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1)" >> "$GITHUB_STEP_SUMMARY"

  backend:
    needs: [version, translate]
    uses: ./.github/workflows/backend.yml
    with:
      version: ${{ needs.version.outputs.version }}
      translations: true

  upstream:
    needs: translate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [server, web]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: translations
          path: app
      - uses: ./.github/actions/setup
      - name: Install Chromium for upstream browser tests
        if: matrix.suite == 'server'
        run: cd app/apps/server && pnpm exec playwright-core install --with-deps chromium
      - name: Run upstream unit suite
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          mkdir -p .run/evidence/release
          scripts/check "upstream:$SUITE" --fresh 2>&1 | tee .run/evidence/release/upstream.log
      - name: Preserve upstream evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-upstream-${{ matrix.suite }}-evidence
          path: .run/evidence/release/
          retention-days: 1

  linux-apps:
    needs: [version, translate]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BASKULE_VERSION: ${{ needs.version.outputs.version }}
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Download release translations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: translations
          path: app
      - uses: ./.github/actions/setup
      - name: Install native Linux packaging and headless tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-dev libxkbcommon-dev imagemagick \
            libgtk-3-0t64 libnss3 libasound2t64 libgbm1 xvfb xauth dbus-x11 locales
          sudo locale-gen en_US.UTF-8
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
      - name: Generate cumulative release compatibility
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p .run/compatibility .run/release/linux-apps
          if gh api --include "repos/$GH_REPO/releases/latest" > .run/compatibility/previous-response; then
            sed '1,/^\r\?$/d' .run/compatibility/previous-response > .run/compatibility/previous-release.json
            previous=$(jq -er .tag_name .run/compatibility/previous-release.json)
            gh release download "$previous" --pattern compatibility.json --dir .run/compatibility
          elif head -1 .run/compatibility/previous-response | grep -q ' 404'; then
            printf '[]\n' > .run/compatibility/compatibility.json
          else
            echo 'Could not read previous published release' >&2
            exit 1
          fi
          node app/scripts/generate-compatibility.ts generate .run/compatibility/compatibility.json "$VERSION" .run/release/linux-apps/compatibility.json
      - name: Build and verify packaged Linux desktop
        shell: bash
        run: |
          set -euo pipefail
          source scripts/env.sh
          mkdir -p .run/evidence/release
          desktop/check.sh 2>&1 | tee .run/evidence/release/desktop-check.log
          desktop/build.sh 2>&1 | tee .run/evidence/release/desktop-build.log
          dbus-run-session -- xvfb-run -a node desktop/verify.mjs 2>&1 | tee .run/evidence/release/desktop-package.log
          cp desktop/release/*.AppImage desktop/release/*.yml .run/release/linux-apps/
          scripts/ci/artifacts.sh .run/release/linux-apps linux-apps
      - name: Upload Linux app artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-apps-${{ needs.version.outputs.version }}
          path: .run/release/linux-apps/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Preserve Linux app evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-apps-evidence-${{ needs.version.outputs.version }}
          path: |
            .run/evidence/release/
            .run/desktop-verification/
            .run/web-mock/artifacts/
            .run/web-mock-build.log
          if-no-files-found: warn
          retention-days: 1

  native:
    needs: [version, translate]
    uses: ./.github/workflows/native.yml
    with:
      version: ${{ needs.version.outputs.version }}
      platform: all
      sign: false
      sign_macos: ${{ github.event_name == 'push' }}
      translations: true
    secrets: inherit

  verified:
    needs: [version, source-ci, translate, upstream, backend, linux-apps, native]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every verification job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'to_entries | all(.[]; .value.result == "success")' <<< "$RESULTS"

  assemble:
    needs: [version, verified]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-${{ needs.version.outputs.version }}
          path: artifacts/backend
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-apps-${{ needs.version.outputs.version }}
          path: artifacts/linux-apps
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*-${{ needs.version.outputs.version }}
          path: artifacts/native
      - name: Verify transferred assets and assemble release
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: scripts/ci/assemble-release.sh
      - name: Retain assembled release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-${{ needs.version.outputs.version }}
          path: release/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [version, assemble]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    concurrency:
      group: release-images-${{ needs.version.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-${{ needs.version.outputs.version }}
          path: artifacts/backend
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0
      - name: Publish verified archives without overwriting release tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: scripts/ci/publish-images.sh artifacts/backend

  public-packages:
    needs: [version, publish]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-${{ needs.version.outputs.version }}
          path: artifacts/backend
      - name: Check anonymous package access (rerun after making packages public)
        run: bash scripts/ci/check-public-images.sh artifacts/backend

  draft-release:
    needs: [version, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets-${{ needs.version.outputs.version }}
          path: release
      - name: Verify assembled assets
        run: cd release && sha256sum -c SHA256SUMS
      - name: Create draft after every verification job passes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "v$VERSION" release/* --draft --target "$SOURCE_COMMIT" \
            --title "Baskule $VERSION" \
            --notes 'Install the server with docker-compose.yml (images on GHCR) or the Helm chart. Apps: Linux AppImage, Windows, macOS and Android (unsigned previews). Built and verified on GitHub-hosted runners with a fake LLM.'

  release:
    needs: [version, draft-release, public-packages]
    if: always() && needs.draft-release.result == 'success' && needs.public-packages.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish the verified draft as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release edit "v$VERSION" --draft=false --latest

  factory-status:
    needs: [version, source-ci, translate, upstream, backend, linux-apps, native, verified, assemble, publish, public-packages, draft-release, release]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Summarize the release factory
        env:
          RESULTS: ${{ toJSON(needs) }}
          VERSION: ${{ needs.version.outputs.version }}
          VERIFIED: ${{ needs.verified.result }}
          ASSEMBLY: ${{ needs.assemble.result }}
          RELEASE: ${{ needs.release.result }}
          PUBLISH: ${{ github.event_name == 'push' }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          state=failure
          if [[ $VERIFIED == success && $ASSEMBLY == success && ( $PUBLISH == false || $RELEASE == success ) ]]; then state=success; fi
          {
            echo "## Release factory: $state"
            echo "Source: $GITHUB_SHA; version: $VERSION; publish: $PUBLISH"
            echo
            echo '| Component | Result |'
            echo '| --- | --- |'
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<< "$RESULTS"
            echo
            echo "[Jobs and retained artifacts]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            if [[ $PUBLISH == true && $state == success ]]; then
              echo "[Published release]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION)"
            elif [[ $PUBLISH == false ]]; then
              echo 'Verification only: no packages or GitHub release were published.'
            else
              echo 'Publication did not complete successfully; inspect the publication jobs before resuming.'
            fi
            echo 'Build artifacts and evidence are retained for one day.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f "state=$state" -f context='Release factory' \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              -f description="Artifact verification and assembly: $state." --silent
          fi
          test "$state" = success
