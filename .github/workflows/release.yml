name: Release factory

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer without v; blank uses VERSION'
        type: string
        required: false
      verify_only:
        description: 'Verify artifacts without publishing images or a GitHub release'
        type: boolean
        default: true
      include_native:
        description: 'Include native packages in verification-only runs (always included for publishing)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: version
        name: Derive and validate source version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            version=${GITHUB_REF_NAME#v}
            [[ "$version" == "$(<VERSION)" ]] || { echo 'Tag version must match VERSION.' >&2; exit 1; }
          else
            version=${INPUT_VERSION:-$(<VERSION)}
          fi
          VERSION="$version" python3 - <<'PY'
          import os
          import re
          version = os.environ['VERSION']
          identifier = r'[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*'
          match = re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)' +
                               rf'(?:-(?P<pre>{identifier}))?(?:\+{identifier})?', version)
          if not match or any(part.isdigit() and len(part) > 1 and part.startswith('0')
                              for part in (match.group('pre') or '').split('.')):
              raise SystemExit('Expected a SemVer source version.')
          PY
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Report manual factory start on the source commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context='Release factory' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description='Full artifact verification is running.' --silent

  source-ci:
    runs-on: ubuntu-24.04
    permissions:
      checks: read
    steps:
      - name: Require ordinary CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.name == "CI required" and .app.slug == "github-actions" and .conclusion == "success") | .id' > passed
          test -s passed || { echo 'Run CI on this exact source commit before releasing.' >&2; exit 1; }

  translate:
    needs: version
    permissions:
      contents: write
    uses: ./.github/workflows/release-translations.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  backend-runtime:
    needs: [version, source-ci]
    uses: ./.github/workflows/release-runtime.yml
    with:
      version: ${{ needs.version.outputs.version }}

  hosted-web:
    needs: [version, translate]
    uses: ./.github/workflows/release-web.yml
    with:
      version: ${{ needs.version.outputs.version }}

  upstream:
    needs: translate
    uses: ./.github/workflows/release-upstream.yml

  backend:
    needs: [version, source-ci, translate, hosted-web, backend-runtime]
    uses: ./.github/workflows/release-backend.yml
    with:
      version: ${{ needs.version.outputs.version }}

  linux-apps:
    needs: [version, translate, hosted-web]
    uses: ./.github/workflows/release-linux.yml
    with:
      version: ${{ needs.version.outputs.version }}

  native:
    needs: [version, translate]
    if: github.event_name == 'push' || inputs.verify_only == false || inputs.include_native == true
    uses: ./.github/workflows/native.yml
    with:
      version: ${{ needs.version.outputs.version }}
      platform: all
      sign: false
      sign_macos: ${{ github.event_name == 'push' || inputs.verify_only == false }}
      translations: true
    secrets: inherit

  verified:
    needs: [version, source-ci, translate, backend-runtime, hosted-web, upstream, backend, linux-apps, native]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected verification job
        env:
          RESULTS: ${{ toJSON(needs) }}
          SKIP_NATIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only && !inputs.include_native }}
        run: |
          jq -e --arg skip_native "$SKIP_NATIVE" '
            to_entries | all(.[];
              .value.result == "success" or
              (.key == "native" and .value.result == "skipped" and $skip_native == "true")
            )' <<< "$RESULTS"

  publication:
    needs: [version, verified]
    if: always() && needs.version.result == 'success' && needs.verified.result == 'success'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release-publish.yml
    with:
      version: ${{ needs.version.outputs.version }}
      publish: ${{ github.event_name == 'push' || inputs.verify_only == false }}
      include_native: ${{ github.event_name == 'push' || inputs.verify_only == false || inputs.include_native }}

  factory-status:
    needs: [version, source-ci, translate, backend-runtime, hosted-web, upstream, backend, linux-apps, native, verified, publication]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Summarize the release factory
        env:
          RESULTS: ${{ toJSON(needs) }}
          VERSION: ${{ needs.version.outputs.version }}
          VERIFIED: ${{ needs.verified.result }}
          PUBLICATION: ${{ needs.publication.result }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.verify_only == false }}
          INCLUDE_NATIVE: ${{ github.event_name == 'push' || inputs.verify_only == false || inputs.include_native }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          state=failure
          if [[ $VERIFIED == success && $PUBLICATION == success ]]; then state=success; fi
          {
            echo "## Release factory: $state"
            echo "Source: $GITHUB_SHA; version: $VERSION; publish: $PUBLISH; native: $INCLUDE_NATIVE"
            echo
            echo '| Component | Result |'
            echo '| --- | --- |'
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<< "$RESULTS"
            echo
            echo "[Jobs and retained artifacts]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            if [[ $PUBLISH == true && $state == success ]]; then
              echo "[Published release]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION)"
            elif [[ $PUBLISH == false ]]; then
              echo 'Verification only: no packages or GitHub release were published.'
            else
              echo 'Publication did not complete successfully; inspect the publication jobs before resuming.'
            fi
            echo 'Build artifacts and evidence are retained for one day.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f "state=$state" -f context='Release factory' \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              -f description="Artifact verification and assembly: $state." --silent
          fi
          test "$state" = success
