name: Release upstream checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  upstream:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [server, web]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: translations
          path: app
      - uses: ./.github/actions/setup
      - name: Install Chromium for upstream browser tests
        if: matrix.suite == 'server'
        run: cd app/apps/server && pnpm exec playwright-core install --with-deps chromium
      - name: Run upstream unit suite
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          mkdir -p .run/evidence/release
          scripts/check "upstream:$SUITE" --fresh 2>&1 | tee .run/evidence/release/upstream.log
      - name: Preserve upstream evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-upstream-${{ matrix.suite }}-evidence
          path: .run/evidence/release/
          retention-days: 1
