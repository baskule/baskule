name: Release translations

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-24.04
    # Only tag pushes use the key; manual runs package the committed catalogs.
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Translate missing release messages
        if: github.event_name == 'push'
        env:
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
          # The project's release translation provider; override with repository or environment variables.
          TRANSLATION_MODEL: ${{ vars.TRANSLATION_MODEL || 'gpt-6-luna' }}
          TRANSLATION_BASE_URL: ${{ vars.TRANSLATION_BASE_URL || 'https://api.openai.com/v1' }}
        run: node app/scripts/localization.ts translate
      - name: Check release catalogs
        if: github.event_name == 'push'
        run: node app/scripts/localization.ts check
      - name: Upload release translations
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: translations
          path: |
            app/packages/shared/src/locales/
            app/apps/mobile/locales/
          if-no-files-found: error
          retention-days: 1
      - name: Push translations for review
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git add app/packages/shared/src/locales/ app/apps/mobile/locales/
          if git diff --cached --quiet; then
            exit 0
          fi
          branch="translations/v$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(i18n): translate v$VERSION"
          gh auth setup-git
          # The bot owns this branch; a rerun replaces it with the catalogs this run shipped.
          git push --force origin "HEAD:refs/heads/$branch"
          echo "[Review translations and create a PR]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1)" >> "$GITHUB_STEP_SUMMARY"
