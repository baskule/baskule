name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  T3CODE_TELEMETRY_ENABLED: 'false'
  BASKULE_CHECK_RECORD: '0'
  NODE_OPTIONS: --max-old-space-size=6144

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
        with:
          runtime: 'true'
          save-cache: 'true'
      - name: harness
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: scripts/ci/check.sh harness 2>&1 | tee .run/evidence/ci-harness.log
      - name: type-root
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: scripts/ci/check.sh type-root 2>&1 | tee .run/evidence/ci-type-root.log
      - name: type-web
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: scripts/ci/check.sh type-web 2>&1 | tee .run/evidence/ci-type-web.log
      - name: type-mobile
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: scripts/ci/check.sh type-mobile 2>&1 | tee .run/evidence/ci-type-mobile.log
      - name: type-shared
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: scripts/ci/check.sh type-shared 2>&1 | tee .run/evidence/ci-type-shared.log
      - name: desktop
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: scripts/ci/check.sh desktop 2>&1 | tee .run/evidence/ci-desktop.log
      - name: Preserve failed check logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-checks
          path: .run/evidence/ci-*.log
          if-no-files-found: ignore
          retention-days: 1

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
        with:
          runtime: 'true'
      - name: platform
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: scripts/ci/check.sh platform 2>&1 | tee .run/evidence/ci-platform.log
      - name: server
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: scripts/ci/check.sh server 2>&1 | tee .run/evidence/ci-server.log
      - name: web-unit
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: scripts/ci/check.sh web-unit 2>&1 | tee .run/evidence/ci-web-unit.log
      - name: mobile
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: scripts/ci/check.sh mobile 2>&1 | tee .run/evidence/ci-mobile.log
      - name: shared
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: scripts/ci/check.sh shared 2>&1 | tee .run/evidence/ci-shared.log
      - name: Preserve failed check logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-tests
          path: .run/evidence/ci-*.log
          if-no-files-found: ignore
          retention-days: 1

  required:
    name: CI required
    if: always()
    needs: [checks, tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Require checks and tests to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: test "$CHECKS_RESULT" = success && test "$TESTS_RESULT" = success
