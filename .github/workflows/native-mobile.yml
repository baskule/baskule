name: Native mobile

on:
  workflow_call:
    inputs:
      translations:
        type: boolean
        default: false
      platform:
        type: string
        default: all
      version:
        type: string
        default: ''
      sign:
        type: boolean
        default: false

permissions:
  contents: read

env:
  CI: '1'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  T3CODE_TELEMETRY_ENABLED: 'false'
  BASKULE_CHECK_RECORD: '0'
  NATIVE_VERSION: ${{ inputs.version }}
  BASKULE_MOBILE_BUILD_NUMBER: ${{ github.run_number }}
  NATIVE_SIGN: ${{ inputs.sign || false }}

jobs:
  signing-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: inputs.sign
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate source before entering the signing environment
        if: inputs.sign
        env:
          SIGN_ALL: ${{ inputs.sign }}
        run: bash scripts/ci/native-signing-source.sh

  android:
    needs: signing-source
    if: inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: ${{ inputs.sign && 'native-release' || 'native-ci' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download release translations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.translations
        with:
          name: translations
          path: app
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.14.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21.0.13+9.0.LTS
      - name: Reclaim unused hosted-runner toolchains for the native build
        run: sudo rm -rf /usr/share/dotnet /usr/local/.ghcup
      - name: Install pinned Android SDK packages
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools platforms;android-37.0 platforms;android-36
            build-tools;37.0.0 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1
      - name: Install frozen mobile dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile --filter @t3tools/monorepo --filter @t3tools/mobile...
      - name: Compile Android arm64 Release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ inputs.sign && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ inputs.sign && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ inputs.sign && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ inputs.sign && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: scripts/ci/native-android.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-android-arm64-${{ inputs.version }}
          path: .run/native/android/*
          if-no-files-found: error
          retention-days: 1

  ios:
    if: inputs.platform == 'all' || inputs.platform == 'ios'
    # Standard public-preview runner; pinned to the SDK used by current native modules.
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download release translations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.translations
        with:
          name: translations
          path: app
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.14.0
      - name: Record Xcode and CocoaPods toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          pod --version
      - name: Install frozen mobile dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile --filter @t3tools/monorepo --filter @t3tools/mobile...
      - name: Compile, install and launch unsigned iOS Release simulator app
        run: scripts/ci/native-ios.sh
      - name: Preserve iOS build and simulator evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: evidence-ios-${{ inputs.version }}
          path: |
            .run/native/ios/build.xcresult/
            .run/native/ios/xcodebuild.log
            .run/native/ios/launch.txt
            .run/native/ios/launch.png
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-ios-simulator-${{ inputs.version }}
          path: |
            .run/native/ios/Baskule-ios-simulator-unsigned.zip
            .run/native/ios/STATUS.txt
            .run/native/ios/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
