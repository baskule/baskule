name: Setup Baskule
description: Pinned Linux tools, frozen workspace dependencies, and optional SpaceCell bundle.
inputs:
  runtime:
    description: Build the SpaceCell bundle for checks that import it.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Native module prerequisites
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y build-essential python3 pkg-config libsecret-1-dev libx11-dev libxkbfile-dev
    - name: Cache pinned tools and package stores
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cache/baskule/tools
          ~/.cache/baskule/cache
          ~/.cache/electron
        key: baskule-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/worktree', 'scripts/env.sh', 'package.json', 'pnpm-lock.yaml', 'app/pnpm-lock.yaml', 'app/pnpm-workspace.yaml', 'app/patches/**', 'app/apps/mobile/deps/**') }}
        restore-keys: |
          baskule-${{ runner.os }}-${{ runner.arch }}-
    - name: Install tools and frozen dependencies
      shell: bash
      env:
        BASKULE_BUILD_RUNTIME: ${{ inputs.runtime }}
      run: |
        export BASKULE_SHARED="$HOME/.cache/baskule"
        mode=setup
        if [[ "$BASKULE_BUILD_RUNTIME" == true ]]; then
          mode=runtime
        fi
        scripts/worktree "$mode"
        source scripts/env.sh
        printf '%s\n' "$BASKULE_ROOT/.tools/bin" "$BASKULE_ROOT/.tools/node-v24.22.1-linux-x64/bin" >> "$GITHUB_PATH"
        printf 'BASKULE_SHARED=%s\npnpm_config_store_dir=%s\nnpm_config_cache=%s\nT3CODE_TELEMETRY_ENABLED=false\nBASKULE_CHECK_RECORD=0\n' "$BASKULE_SHARED" "$pnpm_config_store_dir" "$npm_config_cache" >> "$GITHUB_ENV"
