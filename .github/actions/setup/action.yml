name: Setup Baskule
description: Pinned Linux tools, frozen workspace dependencies, and optional SpaceCell bundle.
inputs:
  runtime:
    description: Build the SpaceCell bundle for checks that import it.
    default: 'false'
  cache:
    description: Restore and save tool and package caches.
    default: 'true'
runs:
  using: composite
  steps:
    - name: Native module prerequisites
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y build-essential python3 pkg-config time libsecret-1-dev libx11-dev libxkbfile-dev
    - name: Cache pinned tools and package stores
      if: inputs.cache == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cache/baskule/tools
          ~/.cache/baskule/cache
          ~/.cache/electron
        key: baskule-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/worktree', 'scripts/env.sh', 'package.json', 'pnpm-lock.yaml', 'app/pnpm-lock.yaml', 'app/pnpm-workspace.yaml', 'app/patches/**', 'app/apps/mobile/deps/**') }}
        restore-keys: |
          baskule-${{ runner.os }}-${{ runner.arch }}-
    - name: Install tools and frozen dependencies
      shell: bash
      env:
        BASKULE_BUILD_RUNTIME: ${{ inputs.runtime }}
        NODE_OPTIONS: --max-old-space-size=3072
      run: |
        export BASKULE_SHARED="$HOME/.cache/baskule"
        mkdir -p "$BASKULE_SHARED" .run/evidence/setup
        setup_resources() {
          date -u
          free -m
          df -h . "$BASKULE_SHARED"
          for resource in memory.max memory.current memory.peak memory.events; do
            if [[ -r "/sys/fs/cgroup/$resource" ]]; then
              printf '%s\n' "$resource"
              cat "/sys/fs/cgroup/$resource"
            fi
          done
        }
        setup_resources | tee .run/evidence/setup/resources-before.txt
        trap 'setup_status=$?; setup_resources | tee .run/evidence/setup/resources-after.txt; exit "$setup_status"' EXIT
        mode=setup
        if [[ "$BASKULE_BUILD_RUNTIME" == true ]]; then
          mode=runtime
        fi
        /usr/bin/time -v -o .run/evidence/setup/time.txt scripts/worktree "$mode" 2>&1 | tee .run/evidence/setup/install.log
        source scripts/env.sh
        printf '%s\n' "$BASKULE_ROOT/.tools/bin" "$BASKULE_ROOT/.tools/node-v24.22.1-linux-x64/bin" >> "$GITHUB_PATH"
        printf 'BASKULE_SHARED=%s\npnpm_config_store_dir=%s\nnpm_config_cache=%s\nT3CODE_TELEMETRY_ENABLED=false\nBASKULE_CHECK_RECORD=0\n' "$BASKULE_SHARED" "$pnpm_config_store_dir" "$npm_config_cache" >> "$GITHUB_ENV"
    - name: Preserve setup diagnostics
      if: always() && (failure() || github.event_name == 'workflow_dispatch' || github.ref_type == 'tag')
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: setup-${{ github.job }}-${{ strategy.job-index || 'single' }}-${{ github.run_attempt }}
        path: .run/evidence/setup/
        if-no-files-found: ignore
        retention-days: 1
