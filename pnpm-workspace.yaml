packages:
  - platform
  - computerd
  - e2e

injectWorkspacePackages: true
enableGlobalVirtualStore: true

overrides:
  '@effect/platform-node-shared': 4.0.6

packageExtensions:
  '@opencode/core@2.2.5':
    dependencies:
      # Published runtime imports this, but upstream lists it as a dev dependency.
      '@effect/platform-node': 4.0.6

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  tree-sitter-bash: true
  tree-sitter-powershell: true
