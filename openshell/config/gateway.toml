# OpenShell gateway config for the baskule-openshell container (Baskule, architecture E5).
# Baked into baskule-openshell-gateway:local at /etc/openshell/gateway.toml.
#
# - Docker compute driver against the PRIVATE dockerd of this container (unix socket only).
# - Plaintext + unauthenticated user API: the port is only reachable on the internal compose network
#   `baskule-computers` (computerd). Computers cannot reach it (fork policy: private addresses are never
#   admitted, tested by e2e/infra-smoke.sh). mTLS from computerd is the planned hardening.
# - Telemetry off: OPENSHELL_TELEMETRY_ENABLED=false in the image env (propagates to supervisors).
# - There is no gateway-wide default network policy in OpenShell: the policy travels with each CreateSandbox.
#   computerd sends ours (openshell/policies/computer.yaml, mirrored in computerd/src/policy.ts).
[openshell]
version = 2

[openshell.gateway]
name = "baskule"
bind_address = "0.0.0.0:47095"
# Health (GET /healthz, /readyz) on loopback only; used by the container healthcheck.
health_bind_address = "127.0.0.1:47097"
log_level = "info"
compute_driver = "docker"
disable_tls = true

[openshell.gateway.auth]
allow_unauthenticated_users = true

# Supervisors authenticate with gateway-minted JWTs; keys are generated by the entrypoint on first start.
[openshell.gateway.gateway_jwt]
signing_key_path = "/var/lib/openshell/tls/jwt/signing.pem"
public_key_path  = "/var/lib/openshell/tls/jwt/public.pem"
kid_path         = "/var/lib/openshell/tls/jwt/kid"
gateway_id       = "baskule"

[openshell.drivers.docker]
socket_path = "/var/run/docker.sock"
# Supervisors run host-networked = in this container's netns, so they reach the gateway on loopback.
grpc_endpoint = "http://127.0.0.1:47095"
sandbox_label = "baskule"
default_image = "baskule-computer:local"
image_pull_policy = "if_not_present"
supervisor_image = "baskule-openshell-supervisor:local"
sandbox_runtime_image = "baskule-openshell-sandbox:local"
app_armor_profile = "Unconfined"
# Per-space persistent volume mounted at /sandbox/space through template.driver_config. Volumes are created by
# volumes.py with the default admission labels (openshell.ai/sandbox-attachable=true,
# openshell.ai/sandbox-attachable-workspace=default). Bind mounts stay disabled.
allow_driver_config = true
enable_bind_mounts = false
